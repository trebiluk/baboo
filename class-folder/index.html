issors. Tree, bed, and path each have their own picture`]},{version:`1.0.30`,date:`2026-09-09`,bullets:[`New icon set for every draw tool, Teach, Access, Help, and Settings — same stroke, same periwinkle flash`]},{version:`1.0.29`,date:`2026-09-09`,bullets:[`Tap a door, window, wall, or furniture — a tiny menu sits under it to change size, swing, or delete`,`Drag a door or window to slide it along the wall. After you place one, the menu opens so you can finish it`]},{version:`1.0.28`,date:`2026-09-09`,bullets:[`Angled rooms: walls snap to 45° as well as 90° — hold Shift for square only`,`Wall → Clip a sharp corner; the room fill and area follow the chamfer`]},{version:`1.0.27`,date:`2026-09-08`,bullets:[`Teacher drawer: Version, What’s new, and Debug in one place — tap the version chip or long-press for Teacher`,`CHANGELOG.md matches the in-app notes so class share and studio stay in sync`]},{version:`1.0.26`,date:`2026-09-08`,bullets:[`GUI pass: same Stark white, black, and periwinkle — quieter chrome, softer cards, friendlier type`]},{version:`1.0.25`,date:`2026-09-08`,bullets:[`Phone: drag the plan to look around, pinch to zoom — tools tuck into a chip so the house can fill the screen`,`Fit stays on the top bar so you can always snap the house back into view`]},{version:`1.0.24`,date:`2026-09-08`,bullets:[`Access check: doors 32", halls 36", bath 5' turn, kitchen aisle, door swing — classroom ADA, not a legal stamp`,`Open Access from the right-hand chip or More. Click a row to highlight it on the plan`]},{version:`1.0.23`,date:`2026-09-08`,bullets:[`2D: Size tool (two clicks), plan notes, and Plant (tree / bed / path)`,`Straight walls by default, live length while you draw, Fit, plus a north arrow and scale bar`]},{version:`1.0.22`,date:`2026-09-07`,bullets:[`Class folder: More → Class folder downloads a zip you drop on the share — kids open index.html in Chrome`,`Works from a network drive or USB with no login and no server; each Chromebook still autosaves on th
