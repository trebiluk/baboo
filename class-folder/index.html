en a door.`,{es:`Dos clics: el inicio, luego el otro extremo. Después una puerta.`,cu:`Dos toques: el inicio, luego el otro extremo. Después una puerta.`,uk:`Два кліки: початок, потім інший кінець. Потім двері.`,ru:`Два клика: начало, потом другой конец. Затем дверь.`,ti:`ክልተ ጠውቕታት፦ መጀመርታ፣ ድሕሪኡ እቲ ካልእ ጫፍ። ድሕሪኡ ማዕጾ።`,fa:`دو کلیک: شروع، بعد سر دیگر. بعد یک در.`}),"cta.dismiss":F(`Dismiss tip`,{es:`Cerrar consejo`,cu:`Cerrar consejo`,uk:`Сховати підказку`,ru:`Скрыть подсказку`,ti:`ምኽሪ ዕጸው`,fa:`بستن راهنما`}),"hint.wall.start":F(`Click a corner to start, then the other end`,{es:`Clic en una esquina, luego el otro extremo`,cu:`Toca una esquina, luego el otro extremo`,uk:`Клікни кут, потім інший кінець`,ru:`Кликни угол, потом другой конец`,ti:`ኣብ ኩርናዕ ጠውቕ፣ ድሕሪኡ እቲ ካልእ ጫፍ`,fa:`یک گوشه را کلیک کن، بعد سر دیگر`}),"hint.wall.start.short":F(`Wall → click start → click end`,{es:`Muro → clic inicio → clic fin`,cu:`Pared → toca inicio → toca fin`,uk:`Стіна → клік початок → клік кінець`,ru:`Стена → клик начало → клик конец`,ti:`መንደቕ → ጠውቕ መጀመርታ → ጠውቕ መወዳእታ`,fa:`دیوار → کلیک شروع → کلیک پایان`}),"hint.wall.end":F(`Nice — now click where it ends`,{es:`Bien — ahora clic donde termina`,cu:`Bien — ahora toca donde termina`,uk:`Гаразд — тепер клікни, де кінець`,ru:`Хорошо — теперь кликни, где конец`,ti:`ጽቡቕ — ሕጂ ኣብቲ ዝውዳእ ጠውቕ`,fa:`خوب — حالا جایی که تمام می‌شود را کلیک کن`}),"hint.wall.end.short":F(`Click where the wall ends`,{es:`Clic donde termina el muro`,cu:`Toca donde termina la pared`,uk:`Клікни, де стіна кінчається`,ru:`Кликни, где стена кончается`,ti:`ኣብቲ መንደቕ ዝውዳእ ጠውቕ`,fa:`جایی که دیوار تمام می‌شود کلیک کن`}),"hint.clip":F(`Clip → click a sharp corner`,{es:`Recorte → clic en una esquina aguda`,cu:`Recorte → toca una esquina aguda`,uk:`Зріз → клікни гострий кут`,ru:`Срез → кликни острый угол`,ti:`ቑረጽ → ኣብ ርሱን ኩርናዕ ጠውቕ`,fa:`برش → یک گوشهٔ تیز را کلیک کن`}),"hint.clip.hot":F(`Click the corner to clip it at 45°`,{es:`Clic en la esquina para recortar a 45°`,cu:`Toca la esquina para recortar a 45°`,uk:`Клікни кут, щоб зрізати під 45°`,ru:`Кликни угол, чтобы срезать под 45°`,ti:`ነቲ ኩርናዕ ብ 45° ንምቑራጽ ጠውቕ`,fa:`گوشه را کلیک کن تا با ۴۵ درجه برش بخورد`}),"hint.sketch":F(`Drag like a pencil. Then tap the sketch → Trace to make walls.`,{es:`Arrastra como lápiz. Luego toca el boceto → Trazar para hacer muros.`,cu:`Arrastra como lápiz. Luego toca el boceto → Trazar para hacer paredes.`,uk:`Тягни як олівцем. Потім торкнись ескізу → Обвести, щоб зробити стіни.`,ru:`Тяни как карандашом. Потом нажми эскиз → Обвести, чтобы сделать стены.`,ti:`ከም ብርዒ ስሓብ። ድሕሪኡ ነቲ ስእሊ ጠውቕ → ቀጥታ መናድቕ ንምግባር።`,fa:`مثل مداد بکش. بعد طرح را بزن → خط‌کشی تا دیوار شود.`}),"hint.sketch.short":F(`Drag to sketch · tap a stroke → Trace to walls`,{es:`Arrastra para bocetar · toca → Trazar muros`,cu:`Arrastra para bocetar · toca → Trazar paredes`,uk:`Тягни ескіз · торкнись → Обвести в стіни`,ru:`Тяни эскиз · нажми → Обвести в стены`,ti:`ንምስኣል ስሓብ · ጠውቕ → ናብ መናድቕ ቀጥታ`,fa:`بکش تا طرح بزنی · بزن → خط‌کشی به دیوار`}),"hint.sketch.drag":F(`Keep dragging — lift to finish the stroke`,{es:`Sigue arrastrando — suelta para terminar`,cu:`Sigue arrastrando — suelta para terminar`,uk:`Тягни далі — відпусти, щоб закінчити`,ru:`Тяни дальше — отпусти, чтобы закончить`,ti:`ቀጽል ስሓብ — ንምውዳእ ልቀቕ`,fa:`به کشیدن ادامه بده — برای تمام کردن رها کن`}),"hint.door":F(`Click right on a wall. Then the little menu can change it.`,{es:`Clic justo en un muro. Luego el menú lo puede cambiar.`,cu:`Toca justo en una pared. Luego el menú la puede cambiar.`,uk:`Клікни саме на стіну. Потім меню може змінити її.`,ru:`Кликни прямо на стену. Потом меню может изменить её.`,ti:`ቀጥታ ኣብ መንደቕ ጠውቕ። ድሕሪኡ እቲ ቁሩብ ዝርዝር ክቕይሮ ይኽእል።`,fa:`درست روی دیوار کلیک کن. بعد منوی کوچک می‌تواند عوضش کند.`}),"hint.door.short":F(`Click on a wall — or tap an existing door to edit`,{es:`Clic en un muro — o toca una puerta para editar`,cu:`Toca una pared — o toca una puerta para editar`,uk:`Клікни на стіну — або торкнись дверей, щоб змінити`,ru:`Кликни на стену — или нажми дверь, чтобы изменить`,ti:`ኣብ መንደቕ ጠውቕ — ወይ ነታ ዘላ ማዕጾ ንምእራም ጠውቕ`,fa:`روی دیوار کلیک کن — یا درِ موجود را برای ویرایش بزن`}),"hint.furn":F(`Click to place · or drag from the side list`,{es:`Clic para colocar · o arrastra de la lista`,cu:`Toca para colocar · o arrastra de la lista`,uk:`Клікни, щоб поставити · або тягни зі списку`,ru:`Кликни, чтобы поставить · или тяни из списка`,ti:`ንምቕማጥ ጠውቕ · ወይ ካብቲ ጎኒ ዝርዝር ስሓብ`,fa:`کلیک کن تا بگذاری · یا از فهرست کنار بکش`}),"hint.room":F(`Pick a type, then click inside walls that close`,{es:`Elige un tipo, luego clic dentro de muros cerrados`,cu:`Escoge un tipo, luego toca dentro de paredes cerradas`,uk:`Обери тип, потім клікни всередині замкнених стін`,ru:`Выбери тип, потом кликни внутри замкнутых стен`,ti:`ዓይነት ምረጽ፣ ድሕሪኡ ኣብ ውሽጢ ዝተዓጽዉ መናድቕ ጠውቕ`,fa:`یک نوع برگزین، بعد داخل دیوارهای بسته کلیک کن`}),"hint.dim":F(`Size → click start, then the other end`,{es:`Medida → clic inicio, luego el otro extremo`,cu:`Medida → toca inicio, luego el otro extremo`,uk:`Розмір → клік початок, потім інший кінець`,ru:`Размер → клик начало, потом другой конец`,ti:`ዓቐን → ጠውቕ መጀመርታ፣ ድሕሪኡ እቲ ካልእ ጫፍ`,fa:`اندازه → کلیک شروع، بعد سر دیگر`}),"hint.dim.end":F(`Click the other end of the size`,{es:`Clic el otro extremo de la medida`,cu:`Toca el otro extremo de la medida`,uk:`Клікни інший кінець розміру`,ru:`Кликни другой конец размера`,ti:`ኣብቲ ካልእ ጫፍ ናይቲ ዓቐን ጠውቕ`,fa:`سر دیگر اندازه را کلیک کن`}),"hint.note":F(`Click the plan, then type in the note box`,{es:`Clic en el plano, luego escribe en la nota`,cu:`Toca el plano, luego escribe en la nota`,uk:`Клікни план, потім пиши в нотатці`,ru:`Кликни план, потом пиши в заметке`,ti:`ኣብቲ ትልሚ ጠውቕ፣ ድሕሪኡ ኣብ ሳጹን መዘኻኸሪ ጽሓፍ`,fa:`روی پلان کلیک کن، بعد در جعبهٔ یادداشت بنویس`}),"hint.plant":F(`Tree, bed, or path — click to plant it`,{es:`Árbol, macizo o camino — clic para plantar`,cu:`Árbol, cantero o camino — toca para plantar`,uk:`Дерево, клумба чи стежка — клікни, щоб посадити`,ru:`Дерево, клумба или дорожка — кликни, чтобы посадить`,ti:`ገረብ፣ ዕንፀይቲ ወይ መንገዲ — ንምትካል ጠውቕ`,fa:`درخت، باغچه یا راه — کلیک کن تا بکاری`}),"hint.pan":F(`Drag to look around · pinch to zoom`,{es:`Arrastra para mirar · pellizca para zoom`,cu:`Arrastra para mirar · pellizca para zoom`,uk:`Тягни, щоб дивитись · щипни для масштабу`,ru:`Тяни, чтобы смотреть · сведи пальцы для масштаба`,ti:`ንምርኣይ ስሓብ · ንምዕባይ ጽቕጽቕ`,fa:`بکش تا نگاه کنی · برای بزرگ‌نمایی نیشگون بگیر`}),"hint.select":F(`Drag empty grid to look around. Tap a wall to move it.`,{es:`Arrastra la cuadrícula vacía. Toca un muro para moverlo.`,cu:`Arrastra la cuadrícula vacía. Toca una pared para moverla.`,uk:`Тягни порожню сітку, щоб дивитись. Торкнись стіни, щоб посунути.`,ru:`Тяни пустую сетку, чтобы смотреть. Нажми стену, чтобы сдвинуть.`,ti:`ነቲ ባዶ መርበብ ስሓብ። ነቲ መንደቕ ንምንቅስቓስ ጠውቕ።`,fa:`شبکهٔ خالی را بکش تا نگاه کنی. دیوار را بزن تا جابه‌جا شود.`}),"hint.select.short":F(`Drag the grid to look around · tap to select`,{es:`Arrastra la cuadrícula · toca para elegir`,cu:`Arrastra la cuadrícula · toca para escoger`,uk:`Тягни сітку · торкнись, щоб обрати`,ru:`Тяни сетку · нажми, чтобы выбрать`,ti:`ነቲ መርበብ ስሓብ · ንምምራጽ ጠውቕ`,fa:`شبکه را بکش · برای انتخاب بزن`}),"hint.doll.empty":F(`Draw walls in 2D Plan, then come back — Dollhouse is for decorating`,{es:`Dibuja muros en Plano 2D, luego vuelve — la casa de muñecas es para decorar`,cu:`Dibuja paredes en Plano 2D, luego vuelve — la casa de muñecas es para decorar`,uk:`Намалюй стіни в Плані 2D, потім повернись — ляльковий дім для оздоблення`,ru:`Нарисуй стены в Плане 2D, потом вернись — кукольный дом для украшения`,ti:`ኣብ ትልሚ 2D መናድቕ ስኣል፣ ድሕሪኡ ተመለስ — ገዛ ዕሸል ንምስልት እዩ`,fa:`در پلان ۲بعدی دیوار بکش، بعد برگرد — خانه عروسکی برای تزئین است`}),"hint.doll.furn":F(`Click the floor to place furniture`,{es:`Clic en el piso para poner muebles`,cu:`Toca el piso para poner muebles`,uk:`Клікни підлогу, щоб поставити меблі`,ru:`Кликни пол, чтобы поставить мебель`,ti:`ኣቓሑት ንምቕማጥ ኣብ ወለል ጠውቕ`,fa:`روی کف کلیک کن تا مبلمان بگذاری`}),"hint.doll.plant":F(`Click the yard to plant a tree`,{es:`Clic en el patio para plantar un árbol`,cu:`Toca el patio para plantar un árbol`,uk:`Клікни двір, щоб посадити дерево`,ru:`Кликни двор, чтобы посадить дерево`,ti:`ገረብ ንምትካል ኣብቲ ካብ ገዛ ወጻኢ ጠውቕ`,fa:`روی حیاط کلیک کن تا درخت بکاری`}),"hint.doll.paper":F(`Tap a wall to paper it · roof is off like a dollhouse`,{es:`Toca un muro para empapelarlo · el techo está quitado`,cu:`Toca una pared para empapelarla · el techo está quitado`,uk:`Торкнись стіни, щоб обклеїти · дах знято, як у ляльковому домі`,ru:`Нажми стену, чтобы оклеить · крыша снята, как у кукольного дома`,ti:`ንምሽፋን መንደቕ ጠውቕ · ጣራ ከም ገዛ ዕሸል ተኣልዩ`,fa:`دیوار را بزن تا کاغذدیواری شود · سقف مثل خانه عروسکی برداشته شده`}),"doll.proj":F(`Drawing view`,{es:`Vista de dibujo`,cu:`Vista de dibujo`,uk:`Вид креслення`,ru:`Вид чертежа`,ti:`ትርኢት ስእሊ`,fa:`نمای رسم`}),"doll.proj.iso":F(`Isometric`,{es:`Isométrica`,cu:`Isométrica`,uk:`Ізометрія`,ru:`Изометрия`,ti:`ኢሶሜትሪክ`,fa:`ایزومتریک`}),"doll.proj.oblique":F(`Oblique`,{es:`Oblicua`,cu:`Oblicua`,uk:`Коса`,ru:`Косая`,ti:`ኣንጻር`,fa:`مایل`}),"doll.proj.elevation":F(`Elevation`,{es:`Alzado`,cu:`Alzado`,uk:`Фасад`,ru:`Фасад`,ti:`ምልቃሕ`,fa:`نما`}),"doll.proj.ortho":F(`Orthographic`,{es:`Ortográfica`,cu:`Ortográfica`,uk:`Ортогональна`,ru:`Ортогональная`,ti:`ኦርቶግራፊክ`,fa:`متعامد`}),"doll.face.front":F(`Front`,{es:`Frente`,cu:`Frente`,uk:`Фасад`,ru:`Фасад`,ti:`ቅድሚት`,fa:`روبرو`}),"doll.face.right":F(`Right`,{es:`Derecha`,cu:`Derecha`,uk:`Право`,ru:`Право`,ti:`የማን`,fa:`راست`}),"doll.face.rear":F(`Rear`,{es:`Atrás`,cu:`Atrás`,uk:`Тил`,ru:`Тыл`,ti:`ድሕሪት`,fa:`پشت`}),"doll.face.left":F(`Left`,{es:`Izquierda`,cu:`Izquierda`,uk:`Ліво`,ru:`Лево`,ti:`ጸጋም`,fa:`چپ`}),"doll.face.top":F(`Top`,{es:`Arriba`,cu:`Arriba`,uk:`Зверху`,ru:`Сверху`,ti:`ላዕሊ`,fa:`بالا`}),"doll.turn.left":F(`Turn left`,{es:`Girar a la izquierda`,cu:`Girar a la izquierda`,uk:`Повернути ліворуч`,ru:`Повернуть влево`,ti:`ናብ ጸጋም ኣዘውር`,fa:`بچرخان به چپ`}),"doll.turn.right":F(`Turn right`,{es:`Girar a la derecha`,cu:`Girar a la derecha`,uk:`Повернути праворуч`,ru:`Повернуть вправо`,ti:`ናብ የማን ኣዘውር`,fa:`بچرخان به راست`}),"doll.lesson.iso":F(`Isometric: all three axes. Turn the house — height stays true. This is a 3/4 view, not a photo.`,{es:`Isométrica: tres ejes. Gira la casa — la altura queda verdadera. Es una vista 3/4, no una foto.`,cu:`Isométrica: tres ejes. Gira la casa — la altura queda verdadera. Es una vista 3/4, no una foto.`,uk:`Ізометрія: три осі. Поверни будинок — висота правдива. Це вид 3/4, не фото.`,ru:`Изометрия: три оси. Поверни дом — высота верная. Это вид 3/4, не фото.`,ti:`ኢሶሜትሪክ፦ ሰለስተ መስመር. ነቲ ገዛ ኣዘውር — ቁመት ሓቀኛ እዩ. እዚ ትርኢት 3/4 እዩ፣ ስእሊ ኣይኮነን.`,fa:`ایزومتریک: هر سه محور. خانه را بچرخان — ارتفاع درست می‌ماند. نمای سه‌چهارم است، نه عکس.`}),"doll.lesson.oblique":F(`Oblique (cabinet): the front is true size. Depth recedes at 45° and is drawn half as long.`,{es:`Oblicua (cabinet): el frente es tamaño verdadero. La profundidad huye a 45° y se dibuja a la mitad.`,cu:`Oblicua (cabinet): el frente es tamaño verdadero. La profundidad huye a 45° y se dibuja a la mitad.`,uk:`Коса (cabinet): фасад правдивого розміру. Глибина тікає під 45° і малюється вдвічі коротшою.`,ru:`Косая (cabinet): фасад верного размера. Глубина уходит под 45° и рисуется вдвое короче.`,ti:`ኣንጻር (cabinet)፦ ቅድሚት ሓቀኛ ዓቐን እያ. ዕምቆት ብ 45° ትኸይድን ፍርቂ ትስኣልን.`,fa:`مایل (کابینت): روبرو اندازهٔ واقعی است. عمق با ۴۵ درجه پس می‌رود و نصف کشیده می‌شود.`}),"doll.lesson.elevation":F(`Elevation: one face, true width and height. Like looking straight at the wall you are papering.`,{es:`Alzado: una cara, ancho y alto verdaderos. Como mirar de frente el muro que empapelas.`,cu:`Alzado: una cara, ancho y alto verdaderos. Como mirar de frente la pared que empapelas.`,uk:`Фасад: одна стіна, правдива ширина й висота. Ніби дивишся просто на стіну, яку обклеюєш.`,ru:`Фасад: одна стена, верная ширина и высота. Как смотреть прямо на стену, которую оклеиваешь.`,ti:`ምልቃሕ፦ ሓደ ገጽ፣ ሓቀኛ ስፍሓትን ቁመትን. ከምቲ ነቲ ዝሽፍኖ መንደቕ ቀጥታ ምርኣይ.`,fa:`نما: یک رخ، پهنا و ارتفاع واقعی. مثل نگاه مستقیم به دیواری که کاغذ می‌کنی.`}),"doll.lesson.ortho":F(`Orthographic: no angle, no squeeze. A drafter’s elevation — turn for Front, Right, Rear, Left.`,{es:`Ortográfica: sin ángulo ni achique. Alzado de delineante — gira Frente, Derecha, Atrás, Izquierda.`,cu:`Ortográfica: sin ángulo ni achique. Alzado de delineante — gira Frente, Derecha, Atrás, Izquierda.`,uk:`Ортогональна: без кута й стиску. Фасад кресляра — повертай Фасад, Право, Тил, Ліво.`,ru:`Ортогональная: без угла и сжатия. Фасад чертёжника — верти Фасад, Право, Тыл, Лево.`,ti:`ኦርቶግራፊክ፦ ኣንግል የለን፣ ምጽቃጥ የለን. ናይ ስእሊ ምልቃሕ — ቅድሚት፣ የማን፣ ድሕሪት፣ ጸጋም ኣዘውር.`,fa:`متعامد: بدون زاویه، بدون فشردن. نمای نقشه‌کش — بچرخان روبرو، راست، پشت، چپ.`}),"doll.lesson.ortho.top":F(`Orthographic top: looking straight down. That is a plan. Walls look like lines because you only see thickness.`,{es:`Ortográfica desde arriba: mirar hacia abajo. Eso es una planta. Los muros se ven como líneas — solo ves el groso.`,cu:`Ortográfica desde arriba: mirar hacia abajo. Eso es una planta. Las paredes se ven como líneas — solo ves el groso.`,uk:`Ортогональна зверху: дивитись просто вниз. Це план. Стіни як лінії — видно лише товщину.`,ru:`Ортогональная сверху: смотреть прямо вниз. Это план. Стены как линии — видна только толщина.`,ti:`ኦርቶግራፊክ ካብ ላዕሊ፦ ቀጥታ ንታሕቲ ምርኣይ. እዚ ትልሚ እዩ. መናድቕ ከም መስመር ይርኣዩ — ውፍሓት ጥራይ እዩ ትሪኢ.`,fa:`متعامد از بالا: نگاه راست به پایین. همان پلان است. دیوارها خط دیده می‌شوند — فقط ضخامت را می‌بینی.`}),"toast.missWall":F(`Almost — click right on a wall`,{es:`Casi — clic justo en un muro`,cu:`Casi — toca justo en una pared`,uk:`Майже — клікни саме на стіну`,ru:`Почти — кликни прямо на стену`,ti:`ኣላሊኻ — ቀጥታ ኣብ መንደቕ ጠውቕ`,fa:`نزدیک بود — درست روی دیوار کلیک کن`}),"toast.doorIn":F(`Door is in — change swing or size in the menu`,{es:`Puerta lista — cambia el giro o el tamaño en el menú`,cu:`Puerta lista — cambia el giro o el tamaño en el menú`,uk:`Двері на місці — зміни відчинення або розмір у меню`,ru:`Дверь на месте — измени открывание или размер в меню`,ti:`ማዕጾ ኣትያ — ኣብቲ ዝርዝር ምኽፋት ወይ ዓቐን ቀይር`,fa:`در گذاشته شد — بازشو یا اندازه را در منو عوض کن`}),"toast.doorDog":F(`Door is in — tap it, pick 12" or 18", then slide it off-center`,{es:`Puerta lista — tócala, elige 12" o 18", luego muévela del centro`,cu:`Puerta lista — tócala, escoge 12" o 18", luego muévela del centro`,uk:`Двері на місці — торкнись, обери 12" або 18", потім зсунь від центру`,ru:`Дверь на месте — нажми, выбери 12" или 18", потом сдвинь от центра`,ti:`ማዕጾ ኣትያ — ጠውቕ፣ 12" ወይ 18" ምረጽ፣ ድሕሪኡ ካብ ማእከል ኣንቀሳቕስ`,fa:`در گذاشته شد — بزن، ۱۲" یا ۱۸" برگزین، بعد از وسط بکش`}),"toast.windowIn":F(`Window is in — drag to slide it`,{es:`Ventana lista — arrástrala para deslizarla`,cu:`Ventana lista — arrástrala para deslizarla`,uk:`Вікно на місці — тягни, щоб зсунути`,ru:`Окно на месте — тяни, чтобы сдвинуть`,ti:`መስኮት ኣትዩ — ንምንቅስቓስ ስሓብ`,fa:`پنجره گذاشته شد — بکش تا بلغزد`}),"toast.furnMove":F(`Click it to scoot it around`,{es:`Clic para moverlo`,cu:`Toca para moverlo`,uk:`Клікни, щоб посунути`,ru:`Кликни, чтобы сдвинуть`,ti:`ንምንቅስቓስ ጠውቕ`,fa:`کلیک کن تا جابه‌جایش کنی`}),"toast.sketchIn":F(`Sketch is in. Keep drawing, or Trace to make walls.`,{es:`Boceto listo. Sigue dibujando, o Traza para hacer muros.`,cu:`Boceto listo. Sigue dibujando, o Traza para hacer paredes.`,uk:`Ескіз є. Малюй далі або Обведи, щоб зробити стіни.`,ru:`Эскиз есть. Рисуй дальше или Обведи, чтобы сделать стены.`,ti:`ስእሊ ኣቶ። ቀጽል ስኣል፣ ወይ መናድቕ ንምግባር ቀጥታ ግበር።`,fa:`طرح گذاشته شد. به کشیدن ادامه بده، یا خط‌کشی کن تا دیوار شود.`}),"toast.sketchFirst":F(`Sketch first, then Trace`,{es:`Primero boceto, luego Trazar`,cu:`Primero boceto, luego Trazar`,uk:`Спочатку ескіз, потім Обвести`,ru:`Сначала эскиз, потом Обвести`,ti:`መጀመርታ ስእሊ፣ ድሕሪኡ ቀጥታ`,fa:`اول طرح، بعد خط‌کشی`}),"toast.clipHint":F(`Click a sharp corner where two walls meet`,{es:`Clic en una esquina aguda donde se juntan dos muros`,cu:`Toca una esquina aguda donde se juntan dos paredes`,uk:`Клікни гострий кут, де сходяться дві стіни`,ru:`Кликни острый угол, где сходятся две стены`,ti:`ኣብቲ ክልተ መናድቕ ዝራኸባ ርሱን ኩርናዕ ጠውቕ`,fa:`گوشهٔ تیزی که دو دیوار به هم می‌رسند را کلیک کن`}),"toast.locked":F(`Unlocks at {level} — Settings to change help`,{es:`Se abre en {level} — Ajustes para cambiar la ayuda`,cu:`Se abre en {level} — Ajustes para cambiar la ayuda`,uk:`Відкриється на рівні {level} — Налаштування, щоб змінити допомогу`,ru:`Откроется на уровне {level} — Настройки, чтобы сменить помощь`,ti:`ኣብ {level} ይኽፈት — ሓገዝ ንምቕያር ቅጥዕታት`,fa:`در {level} باز می‌شود — تنظیمات برای عوض کردن کمک`}),"toast.helpAs":F(`I’ll help as {level}`,{es:`Te ayudo como {level}`,cu:`Te ayudo como {level}`,uk:`Допомагатиму як {level}`,ru:`Буду помогать как {level}`,ti:`ከም {level} ክሕግዘካ እየ`,fa:`کمکت می‌کنم مثل {level}`}),"coach.showMe":F(`Show me`,{es:`Muéstrame`,cu:`Muéstrame`,uk:`Покажи`,ru:`Покажи`,ti:`ኣርእየኒ`,fa:`نشان بده`}),"coach.notNow":F(`Not now`,{es:`Ahora no`,cu:`Ahora no`,uk:`Не зараз`,ru:`Не сейчас`,ti:`ሕጂ ኣይኮነን`,fa:`الان نه`}),"coach.openTeach":F(`Open Teach`,{es:`Abrir Enseñar`,cu:`Abrir Enseñar`,uk:`Відкрити Навчання`,ru:`Открыть Уроки`,ti:`ምምሃር ክፈት`,fa:`باز کردن آموزش`}),"coach.askBaboo":F(`Ask Baboo`,{es:`Preguntar a Baboo`,cu:`Preguntarle a Baboo`,uk:`Запитати Baboo`,ru:`Спросить Baboo`,ti:`ን Baboo ሕተት`,fa:`از Baboo بپرس`}),"coach.kicker":F(`Baboo`,{es:`Baboo`,cu:`Baboo`,uk:`Baboo`,ru:`Baboo`,ti:`Baboo`,fa:`Baboo`}),"coach.sketch.title":F(`Sketch the house first`,{es:`Primero boceta la casa`,cu:`Primero boceta la casa`,uk:`Спочатку намалюй ескіз будинку`,ru:`Сначала нарисуй эскиз дома`,ti:`መጀመርታ ነታ ገዛ ስኣል`,fa:`اول خانه را طرح بزن`}),"coach.sketch.body":F(`Open Tools, pick Sketch. Drag like a pencil. Architecture starts on paper.`,{es:`Abre Herramientas, elige Boceto. Arrastra como lápiz. La arquitectura empieza en papel.`,cu:`Abre Herramientas, escoge Boceto. Arrastra como lápiz. La arquitectura empieza en papel.`,uk:`Відкрий Інструменти, обери Ескіз. Тягни як олівцем. Архітектура починається на папері.`,ru:`Открой Инструменты, выбери Эскиз. Тяни как карандашом. Архитектура начинается на бумаге.`,ti:`መሳርሒታት ክፈት፣ ስእሊ ምረጽ። ከም ብርዒ ስሓብ። ስነ-ህንጻ ኣብ ወረቐት ይጅምር።`,fa:`ابزار را باز کن، طرح را برگزین. مثل مداد بکش. معماری از کاغذ شروع می‌شود.`}),"coach.trace.title":F(`Now hard-line a wall`,{es:`Ahora traza un muro derecho`,cu:`Ahora traza una pared derecha`,uk:`Тепер обведи стіну прямою`,ru:`Теперь обведи стену прямой`,ti:`ሕጂ ቀጥታ መንደቕ ግበር`,fa:`حالا دیوار را خط‌کشی کن`}),"coach.trace.body":F(`Tap the sketch → Trace, or pick Wall and click along it.`,{es:`Toca el boceto → Trazar, o elige Muro y haz clic por encima.`,cu:`Toca el boceto → Trazar, o escoge Pared y toca por encima.`,uk:`Торкнись ескізу → Обвести, або обери Стіна і клікай вздовж.`,ru:`Нажми эскиз → Обвести, или выбери Стена и кликай вдоль.`,ti:`ነቲ ስእሊ ጠውቕ → ቀጥታ፣ ወይ መንደቕ ምረጽ እሞ ኣብ ልዕሊኡ ጠውቕ.`,fa:`طرح را بزن → خط‌کشی، یا دیوار را برگزین و روی آن کلیک کن.`}),"coach.close.title":F(`Close the box`,{es:`Cierra la caja`,cu:`Cierra la caja`,uk:`Замкни коробку`,ru:`Замкни коробку`,ti:`ነታ ሳጹን ዕጸው`,fa:`جعبه را ببند`}),"coach.close.body":F(`Keep going until the walls meet. That’s when it becomes a room.`,{es:`Sigue hasta que los muros se junten. Ahí se vuelve un cuarto.`,cu:`Sigue hasta que las paredes se junten. Ahí se vuelve un cuarto.`,uk:`Продовжуй, доки стіни зійдуться. Тоді це стане кімнатою.`,ru:`Продолжай, пока стены не сойдутся. Тогда это станет комнатой.`,ti:`መናድቕ ክሳብ ዝራኸባ ቀጽል። ሽዑ ክፍሊ ይኸውን።`,fa:`ادامه بده تا دیوارها به هم برسند. همان‌جا اتاق می‌شود.`}),"coach.door.title":F(`Add a door so we can walk in`,{es:`Pon una puerta para entrar`,cu:`Pon una puerta para entrar`,uk:`Додай двері, щоб можна було зайти`,ru:`Добавь дверь, чтобы можно было войти`,ti:`ክንኣቱ ማዕጾ ኣእትው`,fa:`یک در بگذار تا بتوانیم داخل شویم`}),"coach.door.body":F(`Pick Door, then click right on a wall.`,{es:`Elige Puerta, luego clic justo en un muro.`,cu:`Escoge Puerta, luego toca justo en una pared.`,uk:`Обери Двері, потім клікни саме на стіну.`,ru:`Выбери Дверь, потом кликни прямо на стену.`,ti:`ማዕጾ ምረጽ፣ ድሕሪኡ ቀጥታ ኣብ መንደቕ ጠውቕ።`,fa:`در را برگزین، بعد درست روی دیوار کلیک کن.`}),"coach.window.title":F(`Let some light in`,{es:`Deja entrar luz`,cu:`Deja entrar luz`,uk:`Пусти світло всередину`,ru:`Пусти свет внутрь`,ti:`ብርሃን ኣእትው`,fa:`کمی نور بده داخل`}),"coach.window.body":F(`Pick Window, then click a wall across from the door.`,{es:`Elige Ventana, luego clic en un muro frente a la puerta.`,cu:`Escoge Ventana, luego toca una pared frente a la puerta.`,uk:`Обери Вікно, потім клікни стіну навпроти дверей.`,ru:`Выбери Окно, потом кликни стену напротив двери.`,ti:`መስኮት ምረጽ፣ ድሕሪኡ ኣብቲ ንማዕጾ ዝቃወም መንደቕ ጠውቕ።`,fa:`پنجره را برگزین، بعد دیوار روبه‌روی در را کلیک کن.`}),"coach.room.title":F(`Give the room a name`,{es:`Ponle nombre al cuarto`,cu:`Ponle nombre al cuarto`,uk:`Дай кімнаті назву`,ru:`Дай комнате имя`,ti:`ንክፍሊ ስም ሃብ`,fa:`به اتاق اسم بده`}),"coach.room.body":F(`Room tool → Living or Kitchen → click inside the walls.`,{es:`Herramienta Cuarto → Sala o Cocina → clic dentro de los muros.`,cu:`Herramienta Cuarto → Sala o Cocina → toca dentro de las paredes.`,uk:`Інструмент Кімната → Вітальня чи Кухня → клікни всередині стін.`,ru:`Инструмент Комната → Гостиная или Кухня → кликни внутри стен.`,ti:`መሳርሒ ክፍሊ → ሳሎን ወይ ክሽነ → ኣብ ውሽጢ መናድቕ ጠውቕ።`,fa:`ابزار اتاق → نشیمن یا آشپزخانه → داخل دیوارها کلیک کن.`}),"coach.done.title":F(`You did it`,{es:`Lo lograste`,cu:`Lo lograste`,uk:`Ти зробив це`,ru:`У тебя получилось`,ti:`ፈጺምካዮ`,fa:`انجام دادی`}),"coach.done.body":F(`A closed room with a door. Open Teach for a challenge, or raise your level in Settings.`,{es:`Un cuarto cerrado con puerta. Abre Enseñar para un reto, o sube el nivel en Ajustes.`,cu:`Un cuarto cerrado con puerta. Abre Enseñar para un reto, o sube el nivel en Ajustes.`,uk:`Замкнена кімната з дверима. Відкрий Навчання для завдання або підніми рівень у Налаштуваннях.`,ru:`Закрытая комната с дверью. Открой Уроки для задания или подними уровень в Настройках.`,ti:`ዝተዓጽወ ክፍሊ ምስ ማዕጾ። ንፈተነ ምምሃር ክፈት፣ ወይ ኣብ ቅጥዕታት ደረጃ ኣልዕል።`,fa:`اتاق بسته با در. آموزش را برای چالش باز کن، یا سطح را در تنظیمات بالا ببر.`}),"coach.novice-done.title":F(`You have a plan`,{es:`Ya tienes un plano`,cu:`Ya tienes un plano`,uk:`У тебе є план`,ru:`У тебя есть план`,ti:`ትልሚ ኣሎካ`,fa:`یک پلان داری`}),"coach.novice-done.body":F(`Walk the walls. Open Teach for the next step, or switch to Beginner in Settings for windows and names.`,{es:`Camina los muros. Abre Enseñar, o pasa a Principiante en Ajustes para ventanas y nombres.`,cu:`Camina las paredes. Abre Enseñar, o pasa a Principiante en Ajustes para ventanas y nombres.`,uk:`Пройди стіни. Відкрий Навчання або перейди на Початковий у Налаштуваннях для вікон і назв.`,ru:`Пройди стены. Открой Уроки или перейди на Начинающий в Настройках для окон и названий.`,ti:`ነቶም መናድቕ ተጓዓዝ። ምምሃር ክፈት፣ ወይ ኣብ ቅጥዕታት ናብ ጀማሪ ንመሳኹቲን ስማትን ምቅያር።`,fa:`دیوارها را قدم بزن. آموزش را باز کن، یا در تنظیمات به تازه‌کار برو برای پنجره و اسم.`}),"coach.wall.title":F(`Let’s draw a wall`,{es:`Dibujemos un muro`,cu:`Dibujemos una pared`,uk:`Намалюймо стіну`,ru:`Нарисуем стену`,ti:`መንደቕ ንስኣል`,fa:`بیا یک دیوار بکشیم`}),"coach.wall.body":F(`Tools → Wall. Two clicks: start corner, then the end.`,{es:`Herramientas → Muro. Dos clics: esquina de inicio, luego el fin.`,cu:`Herramientas → Pared. Dos toques: esquina de inicio, luego el fin.`,uk:`Інструменти → Стіна. Два кліки: кут початку, потім кінець.`,ru:`Инструменты → Стена. Два клика: угол начала, потом конец.`,ti:`መሳርሒታት → መንደቕ። ክልተ ጠውቕታት፦ ኩርናዕ መጀመርታ፣ ድሕሪኡ መወዳእታ።`,fa:`ابزار → دیوار. دو کلیک: گوشهٔ شروع، بعد پایان.`}),"coach.den.sketch.title":F(`Sketch Baboo a den`,{es:`Boceta una perrera para Baboo`,cu:`Boceta una caseta para Baboo`,uk:`Намалюй Baboo лігво`,ru:`Нарисуй Baboo конуру`,ti:`ን Baboo መደቀሲ ስኣል`,fa:`برای Baboo یک لانه طرح بزن`}),"coach.den.sketch.body":F(`Tools → Sketch. Drag a small box — a dog house is not a people bedroom.`,{es:`Herramientas → Boceto. Arrastra una caja chica — no es un dormitorio de personas.`,cu:`Herramientas → Boceto. Arrastra una caja chica — no es un cuarto de personas.`,uk:`Інструменти → Ескіз. Тягни малу коробку — будка це не спальня для людей.`,ru:`Инструменты → Эскиз. Тяни маленькую коробку — конура это не спальня для людей.`,ti:`መሳርሒታት → ስእሊ። ንእሽቶ ሳጹን ስሓብ — ገዛ ከልቢ ናይ ሰብ መደቀሲ ኣይኮነን።`,fa:`ابزار → طرح. یک جعبهٔ کوچک بکش — خانه سگ اتاق خواب آدم‌ها نیست.`}),"coach.den.trace.title":F(`Hard-line the den`,{es:`Traza la perrera`,cu:`Traza la caseta`,uk:`Обведи лігво`,ru:`Обведи конуру`,ti:`ነቲ መደቀሲ ቀጥታ ግበር`,fa:`لانه را خط‌کشی کن`}),"coach.den.trace.body":F(`Tap the sketch → Trace, or pick Wall and click along it.`,{es:`Toca el boceto → Trazar, o elige Muro y haz clic por encima.`,cu:`Toca el boceto → Trazar, o escoge Pared y toca por encima.`,uk:`Торкнись ескізу → Обвести, або обери Стіна і клікай вздовж.`,ru:`Нажми эскиз → Обвести, или выбери Стена и кликай вдоль.`,ti:`ነቲ ስእሊ ጠውቕ → ቀጥታ፣ ወይ መንደቕ ምረጽ እሞ ኣብ ልዕሊኡ ጠውቕ.`,fa:`طرح را بزن → خط‌کشی، یا دیوار را برگزین و روی آن کلیک کن.`}),"coach.den.close.title":F(`Close the den`,{es:`Cierra la perrera`,cu:`Cierra la caseta`,uk:`Замкни лігво`,ru:`Замкни конуру`,ti:`ነቲ መደቀሲ ዕጸው`,fa:`لانه را ببند`}),"coach.den.close.body":F(`Walls have to meet. Rain stays out only when it’s a box.`,{es:`Los muros tienen que juntarse. La lluvia no entra si es una caja.`,cu:`Las paredes tienen que juntarse. La lluvia no entra si es una caja.`,uk:`Стіни мають зійтися. Дощ не зайде, лише коли це коробка.`,ru:`Стены должны сойтись. Дождь не войдёт, только если это коробка.`,ti:`መናድቕ ክራኸቡ ኣለዎም። ሳጹን እንተኾይኑ ጥራይ ዝናብ ኣይኣቱን።`,fa:`دیوارها باید به هم برسند. باران فقط وقتی جعبه باشد داخل نمی‌آید.`}),"coach.den.door.title":F(`A way in — dog-sized`,{es:`Una entrada — tamaño de perro`,cu:`Una entrada — tamaño de perro`,uk:`Вхід — розмір собаки`,ru:`Вход — размер собаки`,ti:`መእተዊ — ዓቐን ከልቢ`,fa:`راه ورود — اندازهٔ سگ`}),"coach.den.door.body":F(`Pick Door, click a wall, then tap it and pick 12" or 18".`,{es:`Elige Puerta, clic en un muro, luego tócala y elige 12" o 18".`,cu:`Escoge Puerta, toca una pared, luego tócala y escoge 12" o 18".`,uk:`Обери Двері, клікни стіну, потім торкнись і обери 12" або 18".`,ru:`Выбери Дверь, кликни стену, потом нажми и выбери 12" или 18".`,ti:`ማዕጾ ምረጽ፣ መንደቕ ጠውቕ፣ ድሕሪኡ ጠውቕ እሞ 12" ወይ 18" ምረጽ.`,fa:`در را برگزین، دیوار را کلیک کن، بعد بزن و ۱۲" یا ۱۸" برگزین.`}),"coach.den.dog-door.title":F(`Shrink that door`,{es:`Haz esa puerta más chica`,cu:`Haz esa puerta más chica`,uk:`Зменши ті двері`,ru:`Уменьши ту дверь`,ti:`ነታ ማዕጾ ኣሕጽር`,fa:`آن در را کوچک کن`}),"coach.den.dog-door.body":F(`That’s a people door. Tap it → 12" or 18". Heat pours out of a 3-foot opening.`,{es:`Esa es puerta de personas. Tócala → 12" o 18". El calor se escapa por 3 pies.`,cu:`Esa es puerta de personas. Tócala → 12" o 18". El calor se escapa por 3 pies.`,uk:`Це двері для людей. Торкнись → 12" або 18". Тепло витікає з отвору 3 фути.`,ru:`Это дверь для людей. Нажми → 12" или 18". Тепло вытекает из проёма 3 фута.`,ti:`እታ ናይ ሰብ ማዕጾ እያ። ጠውቕ → 12" ወይ 18". ካብ 3 ኣእዳው ክፋት ውዑይ ይውጽእ.`,fa:`آن درِ آدم‌هاست. بزن → ۱۲" یا ۱۸". گرما از دهانهٔ ۳ فوتی می‌ریزد بیرون.`}),"coach.den.offset.title":F(`Slide it off-center`,{es:`Muévela del centro`,cu:`Muévela del centro`,uk:`Зсунь від центру`,ru:`Сдвинь от центра`,ti:`ካብ ማእከል ኣንቀሳቕስ`,fa:`از وسط بکش کنار`}),"coach.den.offset.body":F(`A door in the middle lets wind hit the bed. Drag it toward a corner.`,{es:`Una puerta en el medio deja que el viento dé en la cama. Arrástrala a una esquina.`,cu:`Una puerta en el medio deja que el viento dé en la cama. Arrástrala a una esquina.`,uk:`Двері посередині пускають вітер на ліжко. Потягни до кута.`,ru:`Дверь посередине пускает ветер на лежанку. Потяни к углу.`,ti:`ኣብ ማእከል ዘላ ማዕጾ ንናፋስ ኣብ መደቀሲ የእትዎ። ናብ ኩርናዕ ስሓብ.`,fa:`در وسط می‌گذارد باد به بستر بزند. به سمت گوشه بکش.`}),"coach.den.dim.title":F(`Label the size`,{es:`Etiqueta el tamaño`,cu:`Etiqueta el tamaño`,uk:`Підпиши розмір`,ru:`Подпиши размер`,ti:`ነቲ ዓቐን ምልክት ግበር`,fa:`اندازه را برچسب بزن`}),"coach.den.dim.body":F(`Size tool → two clicks on a wall. The book wants numbers you can read.`,{es:`Medida → dos clics en un muro. El libro quiere números que se puedan leer.`,cu:`Medida → dos toques en una pared. El libro quiere números que se puedan leer.`,uk:`Розмір → два кліки на стіні. Книжка хоче числа, які можна прочитати.`,ru:`Размер → два клика на стене. Книга хочет числа, которые можно прочитать.`,ti:`መሳርሒ ዓቐን → ኣብ መንደቕ ክልተ ጠውቕታት። እቲ መጽሓፍ ዝንበብ ቁጽሪ ይደሊ.`,fa:`ابزار اندازه → دو کلیک روی دیوار. کتاب عددهایی می‌خواهد که خوانده شوند.`}),"coach.den.shade.title":F(`Shade for summer`,{es:`Sombra para el verano`,cu:`Sombra para el verano`,uk:`Тінь на літо`,ru:`Тень на лето`,ti:`ንሓጋይ ጽላሎት`,fa:`سایه برای تابستان`}),"coach.den.shade.body":F(`Plant a tree beside the den. Textbook: shade in July.`,{es:`Planta un árbol junto a la perrera. El libro: sombra en julio.`,cu:`Planta un árbol junto a la caseta. El libro: sombra en julio.`,uk:`Посади дерево біля лігва. Підручник: тінь у липні.`,ru:`Посади дерево рядом с конурой. Учебник: тень в июле.`,ti:`ኣብ ጎኒ መደቀሲ ገረብ ተኽል። መጽሓፍ፦ ኣብ ሓምለ ጽላሎት.`,fa:`کنار لانه یک درخت بکار. کتاب: سایه در ژوئیه.`}),"coach.den.judge.title":F(`Ask Baboo to judge`,{es:`Pide a Baboo que juzgue`,cu:`Pídele a Baboo que juzgue`,uk:`Попроси Baboo оцінити`,ru:`Попроси Baboo оценить`,ti:`ን Baboo ክፈርድ ሕተት`,fa:`از Baboo بخواه داوری کند`}),"coach.den.judge.body":F(`Open Contest. She scores this den against the textbook list.`,{es:`Abre Concurso. Ella califica esta perrera con la lista del libro.`,cu:`Abre Concurso. Ella califica esta caseta con la lista del libro.`,uk:`Відкрий Конкурс. Вона оцінює лігво за списком підручника.`,ru:`Открой Конкурс. Она оценивает конуру по списку учебника.`,ti:`ውድድር ክፈት። ነዚ መደቀሲ ብዝርዝር መጽሓፍ ትነጽጎ።`,fa:`مسابقه را باز کن. او این لانه را با فهرست کتاب نمره می‌دهد.`}),"skill.legend":F(`Skill level`,{es:`Nivel de ayuda`,cu:`Nivel de ayuda`,uk:`Рівень допомоги`,ru:`Уровень помощи`,ti:`ደረጃ ሓገዝ`,fa:`سطح کمک`}),"skill.lead":F(`Lower levels get extra help. Higher levels unlock more tools. You can change this any time.`,{es:`Niveles bajos dan más ayuda. Niveles altos abren más herramientas. Se puede cambiar cuando quieras.`,cu:`Niveles bajos dan más ayuda. Niveles altos abren más herramientas. Se puede cambiar cuando quieras.`,uk:`Нижчі рівні дають більше допомоги. Вищі відкривають більше інструментів. Можна змінити будь-коли.`,ru:`Низкие уровни дают больше помощи. Высокие открывают больше инструментов. Можно сменить в любой момент.`,ti:`ትሑት ደረጃታት ተወሳኺ ሓገዝ ይህቡ። ልዕሊ ደረጃታት ተወሳኺ መሳርሒታት የኽፍቱ። ኩሉ ግዜ ክትቅይሮ ትኽእል።`,fa:`سطح پایین کمک بیشتر می‌گیرد. سطح بالا ابزار بیشتر باز می‌کند. هر وقت خواستی عوض کن.`}),"skill.novice":F(`Novice`,{es:`Novato`,cu:`Novato`,uk:`Новачок`,ru:`Новичок`,ti:`ሓድሽ`,fa:`تازه‌کار`}),"skill.beginner":F(`Beginner`,{es:`Principiante`,cu:`Principiante`,uk:`Початковий`,ru:`Начинающий`,ti:`ጀማሪ`,fa:`مبتدی`}),"skill.moderate":F(`Moderate`,{es:`Intermedio`,cu:`Intermedio`,uk:`Середній`,ru:`Средний`,ti:`ማእከላይ`,fa:`متوسط`}),"skill.expert":F(`Expert`,{es:`Experto`,cu:`Experto`,uk:`Експерт`,ru:`Эксперт`,ti:`ክኢላ`,fa:`حرفه‌ای`}),"skill.novice.blurb":F(`First time — we go slow`,{es:`Primera vez — vamos despacio`,cu:`Primera vez — vamos despacio`,uk:`Перший раз — ідемо повільно`,ru:`Первый раз — идём медленно`,ti:`ቀዳማይ ግዜ — ቀስ ኢልና ንኸይድ`,fa:`بار اول — آرام می‌رویم`}),"skill.beginner.blurb":F(`Learning — extra hints`,{es:`Aprendiendo — más pistas`,cu:`Aprendiendo — más pistas`,uk:`Вчимося — більше підказок`,ru:`Учимся — больше подсказок`,ti:`ንመሃር ኣለና — ተወሳኺ ምልክታት`,fa:`در حال یادگیری — راهنمایی بیشتر`}),"skill.moderate.blurb":F(`Rolling — full toolkit`,{es:`En marcha — caja de herramientas`,cu:`En marcha — caja de herramientas`,uk:`У темпі — повний набір`,ru:`В темпе — полный набор`,ti:`ኣብ ጉዕዞ — ምሉእ መሳርሒታት`,fa:`راه افتادی — جعبه ابزار کامل`}),"skill.expert.blurb":F(`Pro — quiet chrome`,{es:`Pro — chrome callado`,cu:`Pro — chrome callado`,uk:`Про — тихий інтерфейс`,ru:`Про — тихий интерфейс`,ti:`ክኢላ — ህዱእ መተሓላለፊ`,fa:`حرفه‌ای — نوار آرام`}),"new.title":F(`Let's start a plan`,{es:`Empecemos un plano`,cu:`Empecemos un plano`,uk:`Почнімо план`,ru:`Начнём план`,ti:`ትልሚ ንጅምር`,fa:`بیا یک پلان شروع کنیم`}),"new.lead":F(`Pick a house to start from, or a blank grid. You can always start over.`,{es:`Elige una casa para empezar, o una cuadrícula vacía. Siempre puedes empezar de nuevo.`,cu:`Escoge una casa para empezar, o una cuadrícula vacía. Siempre puedes empezar de nuevo.`,uk:`Обери будинок для старту або порожню сітку. Завжди можна почати знову.`,ru:`Выбери дом для старта или пустую сетку. Всегда можно начать снова.`,ti:`ገዛ ምረጽ ወይ ባዶ መርበብ. ኩሉ ግዜ ከም ብሓድሽ ክትጅምር ትኽእል.`,fa:`یک خانه برای شروع برگزین، یا شبکهٔ خالی. همیشه می‌توانی از نو شروع کنی.`}),"new.help":F(`How should I help?`,{es:`¿Cómo te ayudo?`,cu:`¿Cómo te ayudo?`,uk:`Як мені допомагати?`,ru:`Как мне помогать?`,ti:`ከመይ ጌረ ክሕግዘካ?`,fa:`چطور کمکت کنم؟`}),"new.cancel":F(`Cancel`,{es:`Cancelar`,cu:`Cancelar`,uk:`Скасувати`,ru:`Отмена`,ti:`ሰርዝ`,fa:`لغو`}),"teach.hello":F(`One step at a time. Hide this whenever you want the whole grid.`,{es:`Un paso a la vez. Ocúltalo cuando quieras toda la cuadrícula.`,cu:`Un paso a la vez. Escóndelo cuando quieras toda la cuadrícula.`,uk:`По одному кроку. Сховай це, коли потрібна вся сітка.`,ru:`По одному шагу. Спрячь это, когда нужна вся сетка.`,ti:`ሓደ ስጉምቲ ኣብ ሓደ ግዜ. ምሉእ መርበብ ምስ ደሌኻ ሓብኦ.`,fa:`یک قدم در یک زمان. وقتی همهٔ شبکه را می‌خواهی این را پنهان کن.`}),"teach.title":F(`Teach`,{es:`Enseñar`,cu:`Enseñar`,uk:`Навчання`,ru:`Уроки`,ti:`ምምሃር`,fa:`آموزش`}),"teach.read.title":F(`Read this plan`,{es:`Lee este plano`,cu:`Lee este plano`,uk:`Прочитай цей план`,ru:`Прочитай этот план`,ti:`ነዚ ትልሚ ኣንብብ`,fa:`این پلان را بخوان`}),"teach.read.lead":F(`An architect looks at envelope, entry, daylight, names, size, and the kitchen triangle. Classroom notes — not a stamp.`,{es:`Un arquitecto mira el recinto, la entrada, la luz, los nombres, el tamaño y el triángulo de cocina. Notas de clase — no un sello.`,cu:`Un arquitecto mira el recinto, la entrada, la luz, los nombres, el tamaño y el triángulo de cocina. Notas de clase — no un sello.`,uk:`Архітектор дивиться на оболонку, вхід, світло, назви, розмір і кухонний трикутник. Класні нотатки — не печатка.`,ru:`Архитектор смотрит на оболочку, вход, свет, имена, размер и кухонный треугольник. Классные заметки — не печать.`,ti:`ኣርኪተክት መዓንጽ፣ መእተዊ፣ ብርሃን፣ ስማት፣ ዓቐንን ስሉስ ክሽነን ይርኢ. ናይ ክፍሊ መዘኻኸሪ — ማሕተም ኣይኮነን.`,fa:`معمار به پوسته، ورودی، نور، نام‌ها، اندازه و مثلث آشپزخانه نگاه می‌کند. یادداشت کلاس — نه مهر.`}),"teach.read.pass":F(`Looks good`,{es:`Bien`,cu:`Bien`,uk:`Добре`,ru:`Хорошо`,ti:`ጽቡቕ`,fa:`خوب است`}),"teach.read.warn":F(`Take a look`,{es:`Mira esto`,cu:`Mira esto`,uk:`Глянь`,ru:`Глянь`,ti:`ርአ`,fa:`نگاه کن`}),"teach.read.fail":F(`Needs a fix`,{es:`Hay que arreglar`,cu:`Hay que arreglar`,uk:`Треба виправити`,ru:`Надо поправить`,ti:`ምትዕርራይ የድሊ`,fa:`باید درست شود`}),"teach.read.skip":F(`Not yet`,{es:`Aún no`,cu:`Aún no`,uk:`Ще ні`,ru:`Ещё нет`,ti:`ገና ኣይኮነን`,fa:`هنوز نه`}),"sheet.scale":F(`SCALE`,{es:`ESCALA`,cu:`ESCALA`,uk:`МАСШТАБ`,ru:`МАСШТАБ`,ti:`መለክዒ`,fa:`مقیاس`}),"sheet.north":F(`N`,{es:`N`,cu:`N`,uk:`Пн`,ru:`С`,ti:`ሰ`,fa:`ش`}),"sheet.grid":F(`1 square = {n}`,{es:`1 cuadro = {n}`,cu:`1 cuadro = {n}`,uk:`1 клітинка = {n}`,ru:`1 клетка = {n}`,ti:`1 መርበብ = {n}`,fa:`۱ خانه = {n}`}),"teach.vocab":F(`Vocab`,{es:`Vocabulario`,cu:`Vocabulario`,uk:`Словник`,ru:`Словарь`,ti:`ቃላት`,fa:`واژه‌ها`}),"teach.ell.title":F(`Learn the English words`,{es:`Aprende las palabras en inglés`,cu:`Aprende las palabras en inglés`,uk:`Вчи англійські слова`,ru:`Учи английские слова`,ti:`እንግሊዝኛ ቃላት ተማሃር`,fa:`واژه‌های انگلیسی را یاد بگیر`}),"teach.ell.lead":F(`Grades 5–8: say the English word. Your language is the hint. No timer.`,{es:`Grados 5–8: di la palabra en inglés. Tu idioma es la pista. Sin reloj.`,cu:`Grados 5–8: di la palabra en inglés. Tu idioma es la pista. Sin reloj.`,uk:`5–8 класи: скажи англійське слово. Твоя мова — підказка. Без таймера.`,ru:`5–8 классы: скажи английское слово. Твой язык — подсказка. Без таймера.`,ti:`ክፍሊ 5–8፦ ነታ እንግሊዝኛ ቃል በል. ቋንቋኻ ምልክት እያ. ሰዓት የለን.`,fa:`کلاس ۵ تا ۸: واژهٔ انگلیسی را بگو. زبان تو راهنماست. بدون زمان.`}),"teach.ell.say":F(`Say`,{es:`Di`,cu:`Di`,uk:`Скажи`,ru:`Скажи`,ti:`በል`,fa:`بگو`}),"teach.ell.match":F(`Tap an English word, then tap what it means.`,{es:`Toca una palabra en inglés, luego toca lo que significa.`,cu:`Toca una palabra en inglés, luego toca lo que significa.`,uk:`Торкнись англійського слова, потім торкнись значення.`,ru:`Нажми английское слово, потом нажми значение.`,ti:`እንግሊዝኛ ቃል ጠውቕ፣ ድሕሪኡ ትርጉማ ጠውቕ.`,fa:`یک واژهٔ انگلیسی بزن، بعد معنایش را بزن.`}),"teach.ell.done":F(`You know these English words. Use them on the tools.`,{es:`Ya sabes estas palabras en inglés. Úsalas en las herramientas.`,cu:`Ya sabes estas palabras en inglés. Úsalas en las herramientas.`,uk:`Ти знаєш ці англійські слова. Використовуй їх на інструментах.`,ru:`Ты знаешь эти английские слова. Используй их на инструментах.`,ti:`ነዚኦም እንግሊዝኛ ቃላት ትፈልጥ. ኣብ መሳርሒታት ተጠቐመሎም.`,fa:`این واژه‌های انگلیسی را بلدی. روی ابزار از آن‌ها استفاده کن.`}),"teach.ell.again":F(`Practice again`,{es:`Practicar otra vez`,cu:`Practicar otra vez`,uk:`Ще раз`,ru:`Ещё раз`,ti:`መሊስካ ልምምድ`,fa:`دوباره تمرین کن`}),"teach.ell.score":F(`{n} of {total}`,{es:`{n} de {total}`,cu:`{n} de {total}`,uk:`{n} з {total}`,ru:`{n} из {total}`,ti:`{n} ካብ {total}`,fa:`{n} از {total}`}),"teach.ell.means":F(`means`,{es:`quiere decir`,cu:`quiere decir`,uk:`означає`,ru:`значит`,ti:`ትርጉማ`,fa:`یعنی`}),"help.lead":F(`Sketch first, then two clicks make a wall. Open Tools on the left if you get stuck.`,{es:`Primero boceto, luego dos clics hacen un muro. Abre Herramientas a la izquierda si te atoras.`,cu:`Primero boceto, luego dos toques hacen una pared. Abre Herramientas a la izquierda si te atoras.`,uk:`Спочатку ескіз, потім два кліки роблять стіну. Відкрий Інструменти ліворуч, якщо застряг.`,ru:`Сначала эскиз, потом два клика делают стену. Открой Инструменты слева, если застрял.`,ti:`መጀመርታ ስእሊ፣ ድሕሪኡ ክልተ ጠውቕታት መንደቕ ይገብሩ. እንተ ተሓንኪኻ ኣብ ጸጋም መሳርሒታት ክፈት.`,fa:`اول طرح، بعد دو کلیک دیوار می‌سازد. اگر گیر کردی ابزار سمت چپ را باز کن.`}),"udl.title":F(`Help for everyone`,{es:`Ayuda para todos`,cu:`Ayuda para todos`,uk:`Допомога для всіх`,ru:`Помощь для всех`,ti:`ሓገዝ ንኹሉ`,fa:`کمک برای همه`}),"udl.lead":F(`ELL grades 5–8 + special-ed: same tools, English words first, bigger hits, bigger type, slower tips.`,{es:`ELL grados 5–8 + educación especial: mismas herramientas, inglés primero, toques más grandes, letra más grande, tips más lentos.`,cu:`ELL grados 5–8 + educación especial: mismas herramientas, inglés primero, toques más grandes, letra más grande, consejos más lentos.`,uk:`ELL 5–8 класи + особлива освіта: ті самі інструменти, англійська перша, більші натиски, більший шрифт, повільніші підказки.`,ru:`ELL 5–8 классы + особая поддержка: те же инструменты, английский первый, больше кнопки, крупнее шрифт, медленнее подсказки.`,ti:`ELL ክፍሊ 5–8 + ፍሉይ ትምህርቲ፦ ተመሳሳሊ መሳርሒታት፣ እንግሊዝኛ ቅድሚት፣ ዓበይቲ ጠውቕታት፣ ዓቢ ፊደል፣ ዝሓውስ ምኽሪ.`,fa:`زبان‌آموز کلاس ۵ تا ۸ + آموزش ویژه: همان ابزار، انگلیسی اول، ضربهٔ بزرگ‌تر، نوشتهٔ درشت‌تر، راهنمای آهسته‌تر.`}),"udl.fat":F(`Bigger buttons (52px taps)`,{es:`Botones más grandes (toques de 52px)`,cu:`Botones más grandes (toques de 52px)`,uk:`Більші кнопки (натиски 52px)`,ru:`Больше кнопки (нажатия 52px)`,ti:`ዓበይቲ መልጎማት (52px ጠውቕታት)`,fa:`دکمه‌های بزرگ‌تر (ضربهٔ ۵۲px)`}),"udl.type":F(`Bigger type on tips and Teach`,{es:`Letra más grande en consejos y Enseñar`,cu:`Letra más grande en consejos y Enseñar`,uk:`Більший шрифт на підказках і в Навчанні`,ru:`Крупнее шрифт на подсказках и в Уроках`,ti:`ኣብ ምኽርን ምምሃርን ዓቢ ፊደል`,fa:`نوشتهٔ درشت‌تر در راهنما و آموزش`}),"udl.english":F(`Teach English words (grades 5–8)`,{es:`Enseñar palabras en inglés (grados 5–8)`,cu:`Enseñar palabras en inglés (grados 5–8)`,uk:`Вчити англійські слова (5–8 класи)`,ru:`Учить английские слова (5–8 классы)`,ti:`እንግሊዝኛ ቃላት ኣምህር (ክፍሊ 5–8)`,fa:`آموزش واژه‌های انگلیسی (کلاس ۵ تا ۸)`}),"udl.english.lead":F(`Wall, Door, Sketch stay in English on the tools. Your language sits under so kids can learn the drawing words.`,{es:`Wall, Door, Sketch se quedan en inglés en las herramientas. Tu idioma va debajo para que aprendan las palabras de dibujo.`,cu:`Wall, Door, Sketch se quedan en inglés en las herramientas. Tu idioma va debajo para que aprendan las palabras de dibujo.`,uk:`Wall, Door, Sketch лишаються англійською на інструментах. Твоя мова — під ними, щоб вчити слова креслення.`,ru:`Wall, Door, Sketch остаются по-английски на инструментах. Твой язык — под ними, чтобы учить слова чертежа.`,ti:`Wall, Door, Sketch ብእንግሊዝኛ ኣብ መሳርሒታት ይጸንሓ. ቋንቋኻ ኣብ ታሕቲ እያ ምእንቲ ቃላት ስእሊ ክመሃሩ.`,fa:`Wall، Door، Sketch روی ابزار انگلیسی می‌مانند. زبان تو زیر آن‌هاست تا واژه‌های نقشه را یاد بگیرند.`}),"udl.contrast":F(`Need high contrast? Theme → Projector. Prefer cubes? Theme → Blocky.`,{es:`¿Alto contraste? Tema → Projector. ¿Cubos? Tema → Blocky.`,cu:`¿Alto contraste? Tema → Projector. ¿Cubos? Tema → Blocky.`,uk:`Потрібен високий контраст? Тема → Projector. Кубики? Тема → Blocky.`,ru:`Нужен высокий контраст? Тема → Projector. Кубики? Тема → Blocky.`,ti:`ልዑል ንጽጽር? ቴማ → Projector. ኩቡታት? ቴማ → Blocky.`,fa:`کنتراست بالا می‌خواهی؟ پوسته → Projector. مکعب می‌خواهی؟ پوسته → Blocky.`}),"scene.title":F(`3D look`,{es:`Vista 3D`,cu:`Vista 3D`,uk:`Вигляд 3D`,ru:`Вид 3D`,ti:`ትርኢት 3D`,fa:`نمای سه‌بعدی`}),"scene.lead":F(`Changes the Solid 3D preview · view only`,{es:`Cambia la vista 3D sólida · solo mirar`,cu:`Cambia la vista 3D sólida · solo mirar`,uk:`Змінює суцільний 3D перегляд · лише дивитись`,ru:`Меняет сплошной 3D просмотр · только смотреть`,ti:`ነቲ ጽኑዕ 3D ትርኢት ይቕይር · ምርኣይ ጥራይ`,fa:`پیش‌نمایش سه‌بعدی را عوض می‌کند · فقط نگاه`}),"scene.sky":F(`Sky look`,{es:`Cielo`,cu:`Cielo`,uk:`Небо`,ru:`Небо`,ti:`ሰማይ`,fa:`آسمان`}),"scene.yard":F(`Yard look`,{es:`Patio`,cu:`Patio`,uk:`Двір`,ru:`Двор`,ti:`ሓጺር`,fa:`حیاط`}), k:`Учитель`,ru:`Учитель`,ti:`መምህር`,fa:`معلم`}),"chrome.drawHouse":F(`Draw a house for class`,{es:`Dibuja una casa para la clase`,cu:`Dibuja una casa para la clase`,uk:`Намалюй будинок для класу`,ru:`Нарисуй дом для класса`,ti:`ንክፍሊ ገዛ ስኣል`,fa:`برای کلاس یک خانه بکش`}),"chrome.projectName":F(`Project name`,{es:`Nombre del plano`,cu:`Nombre del plano`,uk:`Назва плану`,ru:`Имя плана`,ti:`ስም ትልሚ`,fa:`نام پلان`}),"chrome.saved":F(`Saved`,{es:`Guardado`,cu:`Guardado`,uk:`Збережено`,ru:`Сохранено`,ti:`ተዓቂቡ`,fa:`ذخیره شد`}),"chrome.saving":F(`Saving…`,{es:`Guardando…`,cu:`Guardando…`,uk:`Збереження…`,ru:`Сохранение…`,ti:`ይዕቀብ ኣሎ…`,fa:`در حال ذخیره…`}),"chrome.unsaved":F(`Unsaved`,{es:`Sin guardar`,cu:`Sin guardar`,uk:`Не збережено`,ru:`Не сохранено`,ti:`ኣይተዓቀበን`,fa:`ذخیره نشده`}),"chrome.saveError":F(`Save error`,{es:`Error al guardar`,cu:`Error al guardar`,uk:`Помилка збереження`,ru:`Ошибка сохранения`,ti:`ጌጋ ምዕቃብ`,fa:`خطای ذخیره`}),"chrome.panels":F(`Studio panels`,{es:`Paneles del estudio`,cu:`Paneles del estudio`,uk:`Панелі студії`,ru:`Панели студии`,ti:`ፓነላት ስቱድዮ`,fa:`پنل‌های استودیو`}),"chrome.showPanels":F(`Show Teach, Contest, Access, Help, and Settings`,{es:`Mostrar Enseñar, Concurso, Acceso, Ayuda y Ajustes`,cu:`Mostrar Enseñar, Concurso, Acceso, Ayuda y Ajustes`,uk:`Показати Навчання, Конкурс, Доступ, Допомогу й Налаштування`,ru:`Показать Уроки, Конкурс, Доступ, Помощь и Настройки`,ti:`ምምሃር፣ ውድድር፣ መእተዊ፣ ሓገዝን ቅጥዕታትን ኣርኢ`,fa:`نمایش آموزش، مسابقه، دسترسی، راهنما و تنظیمات`}),"chrome.hidePanels":F(`Hide panels (Esc)`,{es:`Ocultar paneles (Esc)`,cu:`Esconder paneles (Esc)`,uk:`Сховати панелі (Esc)`,ru:`Скрыть панели (Esc)`,ti:`ፓነላት ሓብእ (Esc)`,fa:`پنهان کردن پنل‌ها (Esc)`}),"hint.snapOn":F(`Snap ON`,{es:`Imán ON`,cu:`Imán ON`,uk:`Прив’язка УВІМК`,ru:`Привязка ВКЛ`,ti:`ምልጣፍ ON`,fa:`چسبیدن روشن`}),"hint.snapOff":F(`Snap OFF`,{es:`Imán OFF`,cu:`Imán OFF`,uk:`Прив’язка ВИМК`,ru:`Привязка ВЫКЛ`,ti:`ምልጣፍ OFF`,fa:`چسبیدن خاموش`}),"help.title":F(`Help · About`,{es:`Ayuda · Acerca de`,cu:`Ayuda · Acerca de`,uk:`Допомога · Про застосунок`,ru:`Помощь · О программе`,ti:`ሓገዝ · ብዛዕባ`,fa:`راهنما · درباره`}),"help.sketch":F(`Sketch — drag like a pencil. Architecture starts here. Tap a sketch → Trace to turn it into walls.`,{es:`Boceto (Sketch) — arrastra como lápiz. La arquitectura empieza aquí. Toca un boceto → Trazar para hacer muros.`,cu:`Boceto (Sketch) — arrastra como lápiz. La arquitectura empieza aquí. Toca un boceto → Trazar para hacer paredes.`,uk:`Ескіз (Sketch) — тягни як олівцем. Архітектура починається тут. Торкнись ескізу → Обвести, щоб зробити стіни.`,ru:`Эскиз (Sketch) — тяни как карандашом. Архитектура начинается здесь. Нажми эскиз → Обвести, чтобы сделать стены.`,ti:`ስእሊ (Sketch) — ከም ብርዒ ስሓብ. ስነ-ህንጻ ኣብዚ ይጅምር. ስእሊ ጠውቕ → መናድቕ ንምግባር ቀጥታ.`,fa:`طرح (Sketch) — مثل مداد بکش. معماری از اینجا شروع می‌شود. طرح را بزن → خط‌کشی تا دیوار شود.`}),"help.wall":F(`Wall — click start, click end. Pull 45° for a slanted corner, or Wall → Clip and click a sharp corner.`,{es:`Muro (Wall) — clic inicio, clic fin. Tira a 45° para una esquina, o Muro → Recorte y clic en una esquina aguda.`,cu:`Pared (Wall) — toca inicio, toca fin. Tira a 45° para una esquina, o Pared → Recorte y toca una esquina aguda.`,uk:`Стіна (Wall) — клік початок, клік кінець. Тягни 45° для скошеного кута, або Стіна → Зріз і клікни гострий кут.`,ru:`Стена (Wall) — клик начало, клик конец. Тяни 45° для скошенного угла, или Стена → Срез и кликни острый угол.`,ti:`መንደቕ (Wall) — ጠውቕ መጀመርታ፣ ጠውቕ መወዳእታ. ንኩርናዕ 45° ስሓብ፣ ወይ መንደቕ → ቑረጽ እሞ ርሱን ኩርናዕ ጠውቕ.`,fa:`دیوار (Wall) — کلیک شروع، کلیک پایان. برای گوشهٔ کج ۴۵° بکش، یا دیوار → برش و گوشهٔ تیز را کلیک کن.`}),"help.door":F(`Door / Window — click on a wall to place. Tap one: the edit panel docks on the side. Drag to slide.`,{es:`Puerta / Ventana — clic en un muro. Tócala: el panel se pega al lado. Arrástrala para deslizarla.`,cu:`Puerta / Ventana — toca una pared. Tócala: el panel se pega al lado. Arrástrala para deslizarla.`,uk:`Двері / Вікно — клікни на стіну, щоб поставити. Торкнись: панель редагування збоку. Тягни, щоб зсунути.`,ru:`Дверь / Окно — кликни на стену, чтобы поставить. Нажми: панель правки сбоку. Тяни, чтобы сдвинуть.`,ti:`ማዕጾ / መስኮት — ኣብ መንደቕ ጠውቕ. ሓንቲ ጠውቕ፦ ፓነል ኣርትዖት ኣብ ጎኒ ይተኣሳሰር. ንምንቅስቓስ ስሓብ.`,fa:`در / پنجره — روی دیوار کلیک کن تا بگذاری. یکی را بزن: پنل ویرایش به پهلو می‌چسبد. بکش تا بلغزد.`}),"help.furn":F(`Furniture — open Tools → Furn. → List, click to place, or drag onto the plan; then move with Select.`,{es:`Mueble — abre Herramientas → Mueble → Lista, clic para colocar, o arrastra al plano; luego muévelo con Elegir.`,cu:`Mueble — abre Herramientas → Mueble → Lista, toca para colocar, o arrastra al plano; luego muévelo con Escoger.`,uk:`Меблі — відкрий Інструменти → Меблі → Список, клікни або тягни на план; потім рухай через Обрати.`,ru:`Мебель — открой Инструменты → Мебель → Список, кликни или тяни на план; потом двигай через Выбрать.`,ti:`ኣቓሑት — መሳርሒታት → ኣቓሑት → ዝርዝር ክፈት፣ ጠውቕ ወይ ናብ ትልሚ ስሓብ፣ ድሕሪኡ ብምረጽ ኣንቀሳቕስ.`,fa:`مبلمان — ابزار → مبلمان → فهرست را باز کن، کلیک کن یا روی پلان بکش؛ بعد با انتخاب جابه‌جا کن.`}),"help.room":F(`Room — pick Kitchen, Bath, Living… then click inside walls that close.`,{es:`Cuarto (Room) — elige Cocina, Baño, Sala… luego clic dentro de muros cerrados.`,cu:`Cuarto (Room) — escoge Cocina, Baño, Sala… luego toca dentro de paredes cerradas.`,uk:`Кімната (Room) — обери Кухня, Ванна, Вітальня… потім клікни всередині замкнених стін.`,ru:`Комната (Room) — выбери Кухня, Ванна, Гостиная… потом кликни внутри замкнутых стен.`,ti:`ክፍሊ (Room) — ክሽነ፣ ሽቃቅ፣ ሳሎን ምረጽ… ድሕሪኡ ኣብ ውሽጢ ዝተዓጽዉ መናድቕ ጠውቕ.`,fa:`اتاق (Room) — آشپزخانه، حمام، نشیمن را برگزین… بعد داخل دیوارهای بسته کلیک کن.`}),"help.size":F(`Size — click two points. A length label stays on the plan.`,{es:`Medida — clic en dos puntos. Una etiqueta de tamaño queda en el plano.`,cu:`Medida — toca dos puntos. Una etiqueta de tamaño queda en el plano.`,uk:`Розмір — клікни дві точки. Підпис довжини лишається на плані.`,ru:`Размер — кликни две точки. Подпись длины остаётся на плане.`,ti:`ዓቐን — ክልተ ነጥብታት ጠውቕ. ምልክት ንውሓት ኣብቲ ትልሚ ይተርፍ.`,fa:`اندازه — دو نقطه کلیک کن. برچسب درازا روی پلان می‌ماند.`}),"help.note":F(`Note — click, then type (sun, electric, “front door”).`,{es:`Nota — clic, luego escribe (sol, luz, “puerta de frente”).`,cu:`Nota — toca, luego escribe (sol, luz, “puerta de frente”).`,uk:`Нотатка — клікни, потім пиши (сонце, світло, «вхідні двері»).`,ru:`Заметка — кликни, потом пиши (солнце, свет, «входная дверь»).`,ti:`መዘኻኸሪ — ጠውቕ፣ ድሕሪኡ ጽሓፍ (ጸሓይ፣ ብርሃን፣ “ናይ ቅድሚት ማዕጾ”).`,fa:`یادداشت — کلیک کن، بعد بنویس (آفتاب، برق، «در جلو»).`}),"help.plant":F(`Plant — tree, plant bed, or path for the yard.`,{es:`Planta — árbol, macizo o camino para el patio.`,cu:`Planta — árbol, cantero o camino para el patio.`,uk:`Рослина — дерево, клумба чи стежка для двору.`,ru:`Растение — дерево, клумба или дорожка для двора.`,ti:`ተኽል — ገረብ፣ ዕንፀይቲ ወይ መንገዲ ንሓጺር.`,fa:`گیاه — درخت، باغچه یا راه برای حیاط.`}),"help.doll":F(`Dollhouse — roof off. Switch Isometric, Oblique, Elevation, Orthographic. Turn Front / Right / Rear / Left. Ortho has Top (a plan). Tap a wall to paper it.`,{es:`Casa de muñecas — sin techo. Cambia Isométrica, Oblicua, Alzado, Ortográfica. Gira Frente / Derecha / Atrás / Izquierda. Ortográfica tiene Arriba (una planta). Toca un muro para empapelar.`,cu:`Casa de muñecas — sin techo. Cambia Isométrica, Oblicua, Alzado, Ortográfica. Gira Frente / Derecha / Atrás / Izquierda. Ortográfica tiene Arriba (una planta). Toca una pared para empapelar.`,uk:`Ляльковий дім — без даху. Ізометрія, коса, фасад, ортогональна. Повертай Фасад / Право / Тил / Ліво. Ортогональна має Зверху (план). Торкнись стіни, щоб обклеїти.`,ru:`Кукольный дом — без крыши. Изометрия, косая, фасад, ортогональная. Верти Фасад / Право / Тыл / Лево. Ортогональная имеет Сверху (план). Нажми стену, чтобы оклеить.`,ti:`ገዛ ዕሸል — ብዘይ ጣራ. ኢሶሜትሪክ፣ ኣንጻር፣ ምልቃሕ፣ ኦርቶግራፊክ ቀይር. ቅድሚት / የማን / ድሕሪት / ጸጋም ኣዘውር. ኦርቶግራፊክ ላዕሊ ኣለዋ (ትልሚ). መንደቕ ጠውቕ ንምሽፋን.`,fa:`خانه عروسکی — بی‌سقف. ایزومتریک، مایل، نما، متعامد را عوض کن. روبرو / راست / پشت / چپ بچرخان. متعامد بالا دارد (پلان). دیوار را بزن تا کاغذ شود.`}),"help.view3d":F(`2D edits only — 3D View is look-only. Orbit, Materials, Lighting, and Walkthrough all read the same plan. Edit walls back in 2D Plan or Dollhouse.`,{es:`Solo se edita en 2D — la Vista 3D es solo para mirar. Órbita, Materiales, Luz y Recorrido leen el mismo plano. Edita muros en Plano 2D o Casa de muñecas.`,cu:`Solo se edita en 2D — la Vista 3D es solo para mirar. Órbita, Materiales, Luz y Recorrido leen el mismo plano. Edita paredes en Plano 2D o Casa de muñecas.`,uk:`Редагування лише в 2D — Вигляд 3D тільки для дивитись. Обертання, матеріали, світло й прохід читають той самий план. Правити стіни в Плані 2D або Ляльковому домі.`,ru:`Правка только в 2D — Вид 3D только для просмотра. Вращение, материалы, свет и проход читают тот же план. Править стены в Плане 2D или Кукольном доме.`,ti:`ኣርትዖት 2D ጥራይ — ትርኢት 3D ምርኣይ ጥራይ እዩ. ምዝዋር፣ ንዋት፣ ብርሃንን ምጉዓዝን ነቲ ሓደ ትልሚ የንብቡ. መናድቕ ኣብ ትልሚ 2D ወይ ገዛ ዕሸል ኣርም.`,fa:`ویرایش فقط ۲بعدی — نمای سه‌بعدی فقط نگاه است. چرخش، مصالح، نور و گشت همان پلان را می‌خوانند. دیوارها را در پلان ۲بعدی یا خانه عروسکی ویرایش کن.`}),"help.skill":F(`Skill level — New plan or Settings. Novice and Beginner get extra help. Grey tools unlock at the next skill.`,{es:`Nivel de ayuda — Plano nuevo o Ajustes. Novato y Principiante reciben más ayuda. Las herramientas grises se abren en el siguiente nivel.`,cu:`Nivel de ayuda — Plano nuevo o Ajustes. Novato y Principiante reciben más ayuda. Las herramientas grises se abren en el siguiente nivel.`,uk:`Рівень допомоги — Новий план або Налаштування. Новачок і Початковий отримують більше допомоги. Сірі інструменти відкриються на наступному рівні.`,ru:`Уровень помощи — Новый план или Настройки. Новичок и Начинающий получают больше помощи. Серые инструменты откроются на следующем уровне.`,ti:`ደረጃ ሓገዝ — ሓድሽ ትልሚ ወይ ቅጥዕታት. ሓድሽን ጀማርን ተወሳኺ ሓገዝ ይረኽቡ. ግራጭ መሳርሒታት ኣብ ዝቕጽል ደረጃ ይኽፈቱ.`,fa:`سطح کمک — پلان جدید یا تنظیمات. تازه‌کار و مبتدی کمک بیشتر می‌گیرند. ابزار خاکستری در سطح بعد باز می‌شود.`}),"help.lang":F(`Language — Settings. Pick a home language. Teach English words stays on so grades 5–8 learn Wall, Door, Sketch.`,{es:`Idioma — Ajustes. Elige idioma de casa. Enseñar palabras en inglés queda encendido para que los grados 5–8 aprendan Wall, Door, Sketch.`,cu:`Idioma — Ajustes. Escoge idioma de casa. Enseñar palabras en inglés queda encendido para que los grados 5–8 aprendan Wall, Door, Sketch.`,uk:`Мова — Налаштування. Обери мову дому. Вчити англійські слова лишається ввімкненим, щоб 5–8 класи вчили Wall, Door, Sketch.`,ru:`Язык — Настройки. Выбери язык дома. Учить английские слова остаётся включённым, чтобы 5–8 классы учили Wall, Door, Sketch.`,ti:`ቋንቋ — ቅጥዕታት. ቋንቋ ገዛ ምረጽ. እንግሊዝኛ ቃላት ኣምህር ክፍሊ 5–8 Wall, Door, Sketch ክመሃሩ ትጸንሕ.`,fa:`زبان — تنظیمات. زبان خانه را برگزین. آموزش واژه‌های انگلیسی روشن می‌ماند تا کلاس ۵ تا ۸ واژهٔ Wall، Door، Sketch را یاد بگیرند.`}),"help.udl":F(`Help for everyone — Settings → Teach English words, bigger buttons, bigger type. Projector theme is high contrast.`,{es:`Ayuda para todos — Ajustes → Enseñar palabras en inglés, botones más grandes, letra más grande. El tema Projector es alto contraste.`,cu:`Ayuda para todos — Ajustes → Enseñar palabras en inglés, botones más grandes, letra más grande. El tema Projector es alto contraste.`,uk:`Допомога для всіх — Налаштування → Вчити англійські слова, більші кнопки, більший шрифт. Тема Projector — високий контраст.`,ru:`Помощь для всех — Настройки → Учить английские слова, больше кнопки, крупнее шрифт. Тема Projector — высокий контраст.`,ti:`ሓገዝ ንኹሉ — ቅጥዕታት → እንግሊዝኛ ቃላት ኣምህር፣ ዓበይቲ መልጎማት፣ ዓቢ ፊደል. ቴማ Projector ልዑል ንጽጽር እዩ.`,fa:`کمک برای همه — تنظیمات → آموزش واژه‌های انگلیسی، دکمهٔ بزرگ‌تر، نوشتهٔ درشت‌تر. پوستهٔ Projector کنتراست بالاست.`}),"help.read":F(`Read this plan — Teach. Envelope, door, window, room names, overall size, kitchen triangle. North and scale sit on the sheet.`,{es:`Lee este plano — Enseñar. Recinto, puerta, ventana, nombres, tamaño total, triángulo de cocina. Norte y escala están en la hoja.`,cu:`Lee este plano — Enseñar. Recinto, puerta, ventana, nombres, tamaño total, triángulo de cocina. Norte y escala están en la hoja.`,uk:`Прочитай цей план — Навчання. Оболонка, двері, вікно, назви, загальний розмір, кухонний трикутник. Північ і масштаб на аркуші.`,ru:`Прочитай этот план — Уроки. Оболочка, дверь, окно, имена, общий размер, кухонный треугольник. Север и масштаб на листе.`,ti:`ነዚ ትልሚ ኣንብብ — ምምሃር. መዓንጽ፣ ማዕጾ፣ መስኮት፣ ስማት፣ ምሉእ ዓቐን፣ ስሉስ ክሽነ. ሰሜንን መለክዒን ኣብቲ ወረቐት እዮም.`,fa:`این پلان را بخوان — آموزش. پوسته، در، پنجره، نام‌ها، اندازهٔ کلی، مثلث آشپزخانه. شمال و مقیاس روی برگه است.`}),"scene.sky.day":F(`Day`,{es:`Día`,cu:`Día`,uk:`День`,ru:`День`,ti:`መዓልቲ`,fa:`روز`}),"scene.sky.dusk":F(`Soft dusk`,{es:`Atardecer`,cu:`Atardecer`,uk:`М’які сутінки`,ru:`Мягкие сумерки`,ti:`ምሸት`,fa:`غروب نرم`}),"scene.sky.overcast":F(`Overcast`,{es:`Nublado`,cu:`Nublado`,uk:`Хмарно`,ru:`Пасмурно`,ti:`ደበና`,fa:`ابری`}),"scene.site.grass":F(`Grass`,{es:`Césped (Grass)`,cu:`Yerba (Grass)`,uk:`Трава (Grass)`,ru:`Трава (Grass)`,ti:`ሳዕሪ (Grass)`,fa:`چمن (Grass)`}),"scene.site.gravel":F(`Gravel`,{es:`Grava`,cu:`Grava`,uk:`Гравій`,ru:`Гравий`,ti:`ጸጥሪ`,fa:`شن`}),"scene.site.pad":F(`Pad`,{es:`Losa`,cu:`Losa`,uk:`Плита`,ru:`Плита`,ti:`ዕንጨይቲ`,fa:`کف‌سازی`}),"scene.tint.sand":F(`Sand`,{es:`Arena`,cu:`Arena`,uk:`Пісок`,ru:`Песок`,ti:`ሑጻ`,fa:`شن‌رنگ`}),"scene.tint.white":F(`White`,{es:`Blanco`,cu:`Blanco`,uk:`Білий`,ru:`Белый`,ti:`ጻዕዳ`,fa:`سفید`}),"scene.tint.clay":F(`Clay`,{es:`Barro (Clay)`,cu:`Barro (Clay)`,uk:`Глина (Clay)`,ru:`Глина (Clay)`,ti:`ጭቃ (Clay)`,fa:`گل (Clay)`}),"scene.tint.slate":F(`Slate`,{es:`Pizarra`,cu:`Pizarra`,uk:`Шифер`,ru:`Сланец`,ti:`ስሌት`,fa:`سنگ‌لوح`}),"scene.tint.sage":F(`Sage`,{es:`Salvia`,cu:`Salvia`,uk:`Шавлія`,ru:`Шалфей`,ti:`ሰይጅ`,fa:`مریم‌گلی`}),"scene.tint.sky":F(`Sky`,{es:`Cielo`,cu:`Cielo`,uk:`Небо`,ru:`Небо`,ti:`ሰማይ`,fa:`آسمان`}),"toast.ready":F(`{title} is ready — go draw`,{es:`{title} está listo — a dibujar`,cu:`{title} está listo — a dibujar`,uk:`{title} готовий — малюй`,ru:`{title} готов — рисуй`,ti:`{title} ድልው እዩ — ስኣል`,fa:`{title} آماده است — بکش`}),"toast.contestStart":F(`Baboo’s contest — sketch a snug den, then ask her to judge`,{es:`Concurso de Baboo — boceta una guarida justa, luego pídele que juzgue`,cu:`Concurso de Baboo — boceta una caseta justa, luego pídele que juzgue`,uk:`Конкурс Baboo — намалюй тісне лігво, потім попроси оцінити`,ru:`Конкурс Baboo — нарисуй тесную конуру, потом попроси оценить`,ti:`ውድድር Baboo — ጽቡቕ መደቀሲ ስኣል፣ ድሕሪኡ ክትፈርድ ሕተታ`,fa:`مسابقهٔ Baboo — لانهٔ جمع‌وجور طرح بزن، بعد از او بخواه داوری کند`}),"toast.saved":F(`Saved for class`,{es:`Guardado para la clase`,cu:`Guardado para la clase`,uk:`Збережено для класу`,ru:`Сохранено для класса`,ti:`ንክፍሊ ተዓቂቡ`,fa:`برای کلاس ذخیره شد`}),"toast.card":F(`Class card ready — no last name`,{es:`Tarjeta lista — sin apellido`,cu:`Tarjeta lista — sin apellido`,uk:`Картка класу готова — без прізвища`,ru:`Карточка класса готова — без фамилии`,ti:`ካርድ ክፍሊ ድልው — ቤተሰብ ስም የለን`,fa:`کارت کلاس آماده — بدون نام خانوادگی`}),"toast.imported":F(`Project imported`,{es:`Plano importado`,cu:`Plano importado`,uk:`План імпортовано`,ru:`План импортирован`,ti:`ትልሚ ኣትዩ`,fa:`پلان وارد شد`}),"toast.importFail":F(`Import failed`,{es:`No se pudo importar`,cu:`No se pudo importar`,uk:`Імпорт не вдався`,ru:`Импорт не удался`,ti:`ምእታው ኣይተኽኣለን`,fa:`وارد کردن نشد`}),"toast.dimIn":F(`Size label stuck. Delete removes it.`,{es:`Etiqueta de medida lista. Borrar la quita.`,cu:`Etiqueta de medida lista. Borrar la quita.`,uk:`Підпис розміру на місці. Видалити прибирає його.`,ru:`Подпись размера на месте. Удалить убирает её.`,ti:`ምልክት ዓቐን ተላጢጡ. ሰርዝ የእልዮ.`,fa:`برچسب اندازه چسبید. حذف برمی‌داردش.`}),"toast.noteType":F(`Type in the note box`,{es:`Escribe en la caja de nota`,cu:`Escribe en la caja de nota`,uk:`Пиши в полі нотатки`,ru:`Пиши в поле чшей конуры`,ti:`ውድድር ዝበለጸ ገዛ ከልቢ`,fa:`مسابقهٔ بهترین خانه سگ`}),"teach.dog.goal":F(`A snug outdoor den Baboo would pick — textbook size, not a people house.`,{es:`Una guarida justa que Baboo elegiría — tamaño de libro, no casa de personas.`,cu:`Una caseta justa que Baboo escogería — tamaño de libro, no casa de personas.`,uk:`Тісне зовнішнє лігво, яке обрала б Baboo — розмір підручника, не дім для людей.`,ru:`Тесная уличная конура, которую выбрала бы Baboo — размер учебника, не дом для людей.`,ti:`Baboo እትመርጾ ጽቡቕ ናይ ወጻኢ መደቀሲ — ዓቐን መጽሓፍ፣ ናይ ሰብ ገዛ ኣይኮነን.`,fa:`لانهٔ جمع‌وجور بیرونی که Baboo برمی‌گزیند — اندازهٔ کتاب، نه خانهٔ آدم‌ها.`}),"contest.title":F(`Contest`,{es:`Concurso`,cu:`Concurso`,uk:`Конкурс`,ru:`Конкурс`,ti:`ውድድር`,fa:`مسابقه`}),"contest.aria":F(`Best Dog House Contest`,{es:`Concurso Mejor Perrera`,cu:`Concurso Mejor Caseta`,uk:`Конкурс найкращої будки`,ru:`Конкурс лучшей конуры`,ti:`ውድድር ዝበለጸ ገዛ ከልቢ`,fa:`مسابقهٔ بهترین خانه سگ`}),"contest.dismiss":F(`Dismiss contest`,{es:`Cerrar concurso`,cu:`Cerrar concurso`,uk:`Сховати конкурс`,ru:`Скрыть конкурс`,ti:`ውድድር ዕጸው`,fa:`بستن مسابقه`}),"contest.kicker":F(`Baboo judges`,{es:`Baboo juzga`,cu:`Baboo juzga`,uk:`Baboo оцінює`,ru:`Baboo оценивает`,ti:`Baboo ትፈርድ`,fa:`Baboo داوری می‌کند`}),"contest.points":F(`{score} / {max} textbook points`,{es:`{score} / {max} puntos del libro`,cu:`{score} / {max} puntos del libro`,uk:`{score} / {max} балів підручника`,ru:`{score} / {max} баллов учебника`,ti:`{score} / {max} ነጥቢ መጽሓፍ`,fa:`{score} / {max} امتیاز کتاب`}),"contest.hello":F(`Best Dog House Contest — I pick the den that follows the book.`,{es:`Concurso Mejor Perrera — elijo la guarida que sigue el libro.`,cu:`Concurso Mejor Caseta — escojo la caseta que sigue el libro.`,uk:`Конкурс найкращої будки — обираю лігво, яке йде за книжкою.`,ru:`Конкурс лучшей конуры — выбираю конуру, которая следует книге.`,ti:`ውድድር ዝበለጸ ገዛ ከልቢ — ነቲ ንመጽሓፍ ዝኽተል መደቀሲ እመርጽ.`,fa:`مسابقهٔ بهترین خانه سگ — لانه‌ای را برمی‌گزینم که از کتاب پیروی کند.`}),"contest.helloAny":F(`Any plan can be judged as a dog house. New → Dog House starts the assignment.`,{es:`Cualquier plano se puede juzgar como perrera. Nuevo → Perrera empieza la tarea.`,cu:`Cualquier plano se puede juzgar como caseta. Nuevo → Caseta empieza la tarea.`,uk:`Будь-який план можна оцінити як будку. Новий → Будка починає завдання.`,ru:`Любой план можно оценить как конуру. Новый → Конура начинает задание.`,ti:`ዝኾነ ትልሚ ከም ገዛ ከልቢ ክፍረድ ይኽእል. ሓድሽ → ገዛ ከልቢ ነቲ ዕማም ይጅምር.`,fa:`هر پلانی را می‌توان خانه سگ داوری کرد. جدید → خانه سگ تکلیف را شروع می‌کند.`}),"contest.save":F(`Save file for the board`,{es:`Guardar archivo para el tablero`,cu:`Guardar archivo para el tablero`,uk:`Зберегти файл для дошки`,ru:`Сохранить файл для доски`,ti:`ንቦርድ ፋይል ዓቅብ`,fa:`ذخیرهٔ پرونده برای تابلو`}),"contest.legal":F(`Baboo scores a snug closed den, dog-sized offset door, pitched roof, turning room, and summer shade. Classroom check from textbook shelter rules — not a kennel license.`,{es:`Baboo califica una guarida cerrada, puerta de perro descentrada, techo inclinado, espacio para girar y sombra de verano. Chequeo de clase con las reglas del libro — no es licencia de perrera.`,cu:`Baboo califica una caseta cerrada, puerta de perro descentrada, techo inclinado, espacio para girar y sombra de verano. Chequeo de clase con las reglas del libro — no es licencia de perrera.`,uk:`Baboo оцінює тісне замкнене лігво, двері розміру собаки зсунуті від центру, скатний дах, місце розвернутися й літню тінь. Класна перевірка за правилами підручника — не ліцензія на розплідник.`,ru:`Baboo оценивает тесную закрытую конуру, дверь размера собаки со сдвигом, скатную крышу, место развернуться и летнюю тень. Классная проверка по правилам учебника — не лицензия на питомник.`,ti:`Baboo ጽቡቕ ዝተዓጽወ መደቀሲ፣ ዓቐን ከልቢ ዝተንቀሳቐሰ ማዕጾ፣ ዝተዳኸለ ጣራ፣ ንምዝዋር ቦታን ናይ ሓጋይ ጽላሎትን ትነጽግ። ናይ ክፍሊ ምርመራ ብሕግታት መጽሓፍ — ፍቓድ ከልቢ ኣይኮነን.`,fa:`Baboo لانهٔ بستهٔ جمع‌وجور، در اندازهٔ سگ دور از وسط، سقف شیب‌دار، جای برگشتن و سایهٔ تابستان را نمره می‌دهد. بررسی کلاسی از قاعده‌های کتاب — مجوز نگهداری سگ نیست.`}),"contest.mark.pass":F(`Baboo says yes`,{es:`Baboo dice sí`,cu:`Baboo dice sí`,uk:`Baboo каже так`,ru:`Baboo говорит да`,ti:`Baboo እወ ትብል`,fa:`Baboo می‌گوید بله`}),"contest.mark.warn":F(`Almost`,{es:`Casi`,cu:`Casi`,uk:`Майже`,ru:`Почти`,ti:`ኣላሊኻ`,fa:`نزدیک بود`}),"contest.mark.fail":F(`Not yet`,{es:`Aún no`,cu:`Todavía no`,uk:`Ще ні`,ru:`Ещё нет`,ti:`ገና ኣይኮነን`,fa:`هنوز نه`}),"contest.mark.skip":F(`Start here`,{es:`Empieza aquí`,cu:`Empieza aquí`,uk:`Почни тут`,ru:`Начни здесь`,ti:`ኣብዚ ጀምር`,fa:`از اینجا شروع کن`}),"contest.ribbon.best":F(`Best in show`,{es:`Mejor de la muestra`,cu:`Mejor de la muestra`,uk:`Найкращий на показі`,ru:`Лучший на показе`,ti:`ዝበለጸ ኣብ ምርኢት`,fa:`بهترین نمایش`}),"contest.ribbon.blue":F(`Blue ribbon`,{es:`Listón azul`,cu:`Listón azul`,uk:`Блакитна стрічка`,ru:`Синяя лента`,ti:`ሰማያዊ ሪባን`,fa:`روبان آبی`}),"contest.ribbon.red":F(`Red ribbon`,{es:`Listón rojo`,cu:`Listón rojo`,uk:`Червона стрічка`,ru:`Красная лента`,ti:`ቀይሕ ሪባን`,fa:`روبان سرخ`}),"contest.ribbon.honor":F(`Honorable mention`,{es:`Mención honorífica`,cu:`Mención honorífica`,uk:`Похвальна згадка`,ru:`Почётный отзыв`,ti:`ክቡር ዝኽሪ`,fa:`ذکر شایسته`}),"contest.ribbon.keep":F(`Keep drawing`,{es:`Sigue dibujando`,cu:`Sigue dibujando`,uk:`Малюй далі`,ru:`Рисуй дальше`,ti:`ቀጽል ስኣል`,fa:`به کشیدن ادامه بده`}),"contest.quote.best":F(`I’d nap here. This den follows the book.`,{es:`Aquí sí dormiría. Esta guarida sigue el libro.`,cu:`Aquí sí dormiría. Esta caseta sigue el libro.`,uk:`Я б тут подрімала. Це лігво йде за книжкою.`,ru:`Я бы здесь вздремнула. Эта конура следует книге.`,ti:`ኣብዚ እደቅስ. እዚ መደቀሲ ንመጽሓፍ ይኽተል.`,fa:`اینجا چرت می‌زنم. این لانه از کتاب پیروی می‌کند.`}),"contest.quote.blue":F(`Almost — a couple textbook fixes and I’d pick this.`,{es:`Casi — un par de arreglos del libro y la elijo.`,cu:`Casi — un par de arreglos del libro y la escojo.`,uk:`Майже — кілька виправлень за книжкою, і я б це обрала.`,ru:`Почти — пара правок / дерен (Grass)`,def:`Живий зелений дах із рослинами. (Гобіт.)`},Conical:{term:`Конічний (Conical)`,def:`Дах-конус на круглому плані. (Юрта.)`},Ridge:{term:`Гребінь (Ridge)`,def:`Висока лінія, де сходяться схили даху.`},"Kitchen triangle":{term:`Кухонний трикутник`,def:`Шлях між мийкою, плитою й холодильником. Хай буде короткий.`},"Floor area":{term:`Площа підлоги (Floor area)`,def:`Наскільки великий будинок усередині, у квадратних футах.`},"Accessible route":{term:`Доступний шлях`,def:`Доріжка завширшки 3 фути для візка — від дверей до кімнат.`},"Clear width":{term:`Чиста ширина (Clear width)`,def:`Вільний прохід у дверях. ADA просить 32 дюйми.`},"Turning circle":{term:`Коло розвороту`,def:`Коло 5 футів, щоб візок міг розвернутися, часто у ванні.`},Den:{term:`Лігво (Den)`,def:`Тісна спальна коробка. Будка — одна кімната, не план для людей.`},"Offset door":{term:`Зсунуті двері (Offset door)`,def:`Проріз не посередині — вітер і дощ минають ліжко.`},"Body heat":{term:`Тілесне тепло (Body heat)`,def:`Лігво якраз за розміром гріється. Завелике — собака не нагріє.`}},ru:{Sketch:{term:`Эскиз (Sketch)`,def:`Свободная карандашная линия. Сначала эскиз, потом прямые стены.`},Trace:{term:`Обвести (Trace)`,def:`Превращает эскиз в прямые стены. Карандаш остаётся снизу.`},Wall:{term:`Стена (Wall)`,def:`Линия, которая делает комнату. Кликни начало, потом другой конец.`},Door:{term:`Дверь (Door)`,def:`Проём, через который входят. Кликни прямо на стену.`},Window:{term:`Окно (Window)`,def:`Проём, который пускает свет. Кликни стену напротив двери.`},Scale:{term:`Масштаб (Scale)`,def:`Размер рисунка против настоящего. Пример: 1 клетка = 1 фут.`},North:{term:`Север (North)`,def:`Верх листа. Планы держат север вверху, чтобы все читали одинаково.`},"Title block":{term:`Штамп (Title block)`,def:`Имя, масштаб и дата на чертеже. На каждом листе есть.`},Envelope:{term:`Оболочка (Envelope)`,def:`Наружные стены, которые закрывают дом от погоды.`},"Overall dimension":{term:`Габарит (Overall dimension)`,def:`Большой внешний размер — ширина и глубина всей оболочки.`},Isometric:{term:`Изометрия (Isometric)`,def:`Вид 3/4. Три оси. Высота верная. Не фото.`},Oblique:{term:`Косая (Oblique)`,def:`Фасад верного размера. Глубина уходит под 45° и рисуется короче (cabinet).`},Elevation:{term:`Фасад (Elevation)`,def:`Одна стена дома, верная ширина и высота. Смотреть прямо на стену.`},Orthographic:{term:`Ортогональная (Orthographic)`,def:`Без угла и сжатия. Фасады спереди/сбоку/сзади и вид сверху (план).`},"Floor plan":{term:`План этажа (Floor plan)`,def:`Смотреть на комнаты сверху.`},Room:{term:`Комната (Room)`,def:`Закрытое пространство с именем — кухня, ванная, спальня.`},"Interior wall":{term:`Внутренняя стена (Interior wall)`,def:`Стена, которая делит большое пространство на комнаты.`},Dimension:{term:`Размер (Dimension)`,def:`Подпись размера на стене или пространстве.`},"Door swing":{term:`Дуга двери (Door swing)`,def:`Кривая, которая показывает, куда открывается дверь.`},Opening:{term:`Проём (Opening)`,def:`Дверь или окно, вырезанные в стене.`},Circulation:{term:`Движение (Circulation)`,def:`Как люди ходят по плану. (Также трафик.)`},Grid:{term:`Сетка (Grid)`,def:`Ровные линии, которые помогают рисовать в размер.`},Snap:{term:`Привязка (Snap)`,def:`Указатель прыгает на сетку, чтобы линии были ровные.`},Gable:{term:`Двускатная (Gable)`,def:`Два ската встречаются на коньке — треугольные торцы.`},Hip:{term:`Вальмовая (Hip)`,def:`Скаты со всех сторон сходятся вверх.`},Gambrel:{term:`Гамбрель (Gambrel)`,def:`Крыша как у сарая — два наклона с каждой стороны.`},Shed:{term:`Односкатная (Shed)`,def:`Один скат, как навес.`},Flat:{term:`Плоская (Flat)`,def:`Почти ровная сверху.`},Mansard:{term:`Мансарда (Mansard)`,def:`Крутые бока + более плоская вершина.`},"Grass / sod":{term:`Трава / дёрн (Grass)`,def:`Живая зелёная крыша с растениями. (Хоббит.)`},Conical:{term:`Коническая (Conical)`,def:`Крыша-конус на круглом плане. (Юрта.)`},Ridge:{term:`Конёк (Ridge)`,def:`Высокая линия, где сходятся скаты крыши.`},"Kitchen triangle":{term:`Кухонный треугольник`,def:`Путь между мойкой, плитой и холодильником. Пусть будет короткий.`},"Floor area":{term:`Площадь пола (Floor area)`,def:`Насколько большой дом внутри, в квадратных футах.`},"Accessible route":{term:`Доступный путь`,def:`Дорожка шириной 3 фута для коляски — от двери до комнат.`},"Clear width":{term:`Чистая ширина (Clear width)`,def:`Свободный проход в двери. ADA просит 32 дюйма.`},"Turning circle":{term:`Круг разворота`,def:`Круг 5 футов, чтобы коляска могла развернуться, часто в ванной.`},Den:{term:`Конура (Den)`,def:`Тесная спальная коробка. Собачья будка — одна комната, не план для людей.`},"Offset door":{term:`Сдвинутая дверь (Offset door)`,def:`Проём не посередине — ветер и дождь минуют лежанку.`},"Body heat":{term:`Тепло тела (Body heat)`,def:`Конура как раз по размеру греется. Слишком большая — собака не нагреет.`}},ti:{Sketch:{term:`ስእሊ (Sketch)`,def:`ናይ ኢድ መስመር ብርዒ. መጀመርታ ስእሊ፣ ድሕሪኡ ቀጥታ መናድቕ.`},Trace:{term:`ቀጥታ (Trace)`,def:`ስእሊ ናብ ቀጥታ መናድቕ ይቕይር. እቲ ብርዒ ኣብ ታሕቲ ይተርፍ.`},Wall:{term:`መንደቕ (Wall)`,def:`ክፍሊ ዝገብር መስመር. ጠውቕ መጀመርታ፣ ድሕሪኡ እቲ ካልእ ጫፍ.`},Door:{term:`ማዕጾ (Door)`,def:`እትኣትወላ ክፋት. ቀጥታ ኣብ መንደቕ ጠውቕ.`},Window:{term:`መስኮት (Window)`,def:`ብርሃን ዘእቱ ክፋት. ኣብቲ ንማዕጾ ዝቃወም መንደቕ ጠውቕ.`},Scale:{term:`መለክዒ (Scale)`,def:`ዓቐን ስእሊ ምስ ሓቀኛ ዓቐን. ኣብነት፦ 1 መርበብ = 1 እግሪ.`},North:{term:`ሰሜን (North)`,def:`ላዕሊ ናይቲ ወረቐት. ትልምታት ሰሜን ኣብ ላዕሊ የቐምጡ ምእንቲ ኩሉ ከም ሓደ ክነብብ.`},"Title block":{term:`ሳጹን ስም (Title block)`,def:`ስም፣ መለክዒን ዕለትን ኣብቲ ስእሊ. ነፍሲ ወከፍ ወረቐት ኣለዋ.`},Envelope:{term:`መዓንጽ (Envelope)`,def:`እቶም ናይ ደገ መናድቕ ገዛ ካብ ኩነታት ኣየር ዝዕጽዉ.`},"Overall dimension":{term:`ምሉእ ዓቐን (Overall dimension)`,def:`እቲ ዓቢ ናይ ደገ ዓቐን — ስፍሓትን ዕምቆትን ናይ መዓንጽ.`},Isometric:{term:`ኢሶሜትሪክ (Isometric)`,def:`ትርኢት 3/4. ሰለስተ መስመር. ቁመት ሓቀኛ እዩ. ስእሊ ኣይኮነን.`},Oblique:{term:`ኣንጻር (Oblique)`,def:`ቅድሚት ሓቀኛ ዓቐን እያ. ዕምቆት ብ 45° ትኸይድን ሓጺር ትስኣልን (cabinet).`},Elevation:{term:`ምልቃሕ (Elevation)`,def:`ሓደ ገጽ ናይ ገዛ፣ ሓቀኛ ስፍሓትን ቁመትን. ቀጥታ ኣብ መንደቕ ምርኣይ.`},Orthographic:{term:`ኦርቶግራፊክ (Orthographic)`,def:`ኣንግል የለን፣ ምጽቃጥ የለን. ምልቃሕ ቅድሚት/ጎኒ/ድሕሪትን ትርኢት ላዕሊን (ትልሚ).`},"Floor plan":{term:`ትልሚ ወለል (Floor plan)`,def:`ነቶም ክፍልታት ካብ ላዕሊ ምርኣይ.`},Room:{term:`ክፍሊ (Room)`,def:`ዝተዓጽወ ቦታ ምስ ስም — ክሽነ፣ ሽቃቅ፣ መደቀሲ.`},"Interior wall":{term:`ውሽጣዊ መንደቕ (Interior wall)`,def:`ዓቢ ቦታ ናብ ክፍልታት ዝመቕል መንደቕ.`},Dimension:{term:`ዓቐን (Dimension)`,def:`ምልክት ዓቐን ኣብ መንደቕ ወይ ቦታ.`},"Door swing":{term:`ምኽፋት ማዕጾ (Door swing)`,def:`ማዕጾ ናበይ ከም እትኽፈት ዘርኢ ቅስም.`},Opening:{term:`ክፋት (Opening)`,def:`ኣብ መንደቕ ዝተቖረጸ ማዕጾ ወይ መስኮት.`},Circulation:{term:`ምንቅስቓስ (Circulation)`,def:`ሰባት ከመይ ከም ዝኸዱ ኣብቲ ትልሚ. (ትራፊክ ድማ.)`},Grid:{term:`መርበብ (Grid)`,def:`ማዕረ መስመራት ንምስኣል ብዓቐን ይሕግዙ.`},Snap:{term:`ምልጣፍ (Snap)`,def:`እቲ መጠወቒ ናብ መርበብ ይዘልል ምእንቲ መስመራት ጽሩይ ክኾኑ.`},Gable:{term:`ክልተ ስኒ (Gable)`,def:`ክልተ ውድቀታት ኣብ ጫፍ ይራኸቡ — ጫፋት ስሉስ ኩርናዕ.`},Hip:{term:`ኣርባዕተ ስኒ (Hip)`,def:`ውድቀታት ካብ ኩሉ ጎኒ ናብ ላዕሊ ይራኸቡ.`},Gambrel:{term:`ጋምብረል (Gambrel)`,def:`ጣራ ከም ጎተራ — ክልተ ውድቀት ኣብ ነፍሲ ወከፍ ጎኒ.`},Shed:{term:`ሓደ ስኒ (Shed)`,def:`ሓደ ውድቀት፣ ከም ድንኳን.`},Flat:{term:`ጸፊሕ (Flat)`,def:`ኣብ ላዕሊ ዳርጋ ጸፊሕ.`},Mansard:{term:`ማንሳርድ (Mansard)`,def:`ቁልቁል ጎኒታት + ዝለዓለ ጸፊሕ ጫፍ.`},"Grass / sod":{term:`ሳዕሪ (Grass)`,def:`ቀጠልያ ህያው ጣራ ምስ ተኽልታት. (ሆቢት.)`},Conical:{term:`ኮን (Conical)`,def:`ጣራ ኮን ኣብ ክቢ ትልሚ. (ዩርት.)`},Ridge:{term:`ጫፍ ጣራ (Ridge)`,def:`እቲ ልዑል መስመር ኣብቲ ውድቀታት ጣራ ዝራኸባ.`},"Kitchen triangle":{term:`ስሉስ ኩርናዕ ክሽነ`,def:`መንገዲ ኣብ መንጎ ሕጻብ፣ ምድጃን ፍሪጅን. ሓጺር ይኹን.`},"Floor area":{term:`ስፍሓት ወለል (Floor area)`,def:`እታ ገዛ ኣብ ውሽጢ ክንደይ ዓባይ፣ ብትርብዕ እግሪ.`},"Accessible route":{term:`መእተዊ መንገዲ`,def:`3 እግሪ ስፍሓት መንገዲ ንሽቃቅ — ካብ ማዕጾ ናብ ክፍልታት.`},"Clear width":{term:`ጽሩይ ስፍሓት (Clear width)`,def:`እቲ ክፉት ቦታ ኣብ ማዕጾ. ADA 32 ኢንች ይሓትት.`},"Turning circle":{term:`ክቢ ምዝዋር`,def:`5 እግሪ ክቢ ሽቃቅ ክዘውር፣ መብዛሕትኡ ኣብ ሽቃቅ.`},Den:{term:`መደቀሲ (Den)`,def:`ጽቡቕ ንእሽቶ ሳጹን ድቃስ. ገዛ ከልቢ ሓደ ክፍሊ እዩ፣ ናይ ሰብ ትልሚ ኣይኮነን.`},"Offset door":{term:`ዝተንቀሳቐሰ ማዕጾ (Offset door)`,def:`ክፋት ኣብ ማእከል ኣይኮነን — ንፋስን ዝናብን ነቲ መደቀሲ ኣየንክፉን.`},"Body heat":{term:`ውዑይ ኣካል (Body heat)`,def:`ልክዕ ዓቐን መደቀሲ ይውዕይ. ዝዓበየ — እቲ ከልቢ ኣየውዕዮን.`}},fa:{Sketch:{term:`طرح (Sketch)`,def:`خط آزاد با مداد. اول طرح، بعد دیوارهای راست.`},Trace:{term:`خط‌کشی (Trace)`,def:`طرح را به دیوار راست بدل می‌کند. خط مداد زیر می‌ماند.`},Wall:{term:`دیوار (Wall)`,def:`خطی که اتاق می‌سازد. کلیک شروع، بعد سر دیگر.`},Door:{term:`در (Door)`,def:`دهانه‌ای که از آن راه می‌روی. درست روی دیوار کلیک کن.`},Window:{term:`پنجره (Window)`,def:`دهانه‌ای که نور می‌دهد. دیوار روبه‌روی در را کلیک کن.`},Scale:{term:`مقیاس (Scale)`,def:`اندازهٔ نقاشی در برابر اندازهٔ واقعی. مثال: ۱ خانه = ۱ فوت.`},North:{term:`شمال (North)`,def:`بالای برگه. پلان‌ها شمال را بالا می‌گذارند تا همه یک‌جور بخوانند.`},"Title block":{term:`کادر عنوان (Title block)`,def:`نام، مقیاس و تاریخ روی نقشه. هر برگه یکی دارد.`},Envelope:{term:`پوسته (Envelope)`,def:`دیوارهای بیرونی که خانه را از هوا می‌بندند.`},"Overall dimension":{term:`اندازهٔ کلی (Overall dimension)`,def:`اندازهٔ بزرگ بیرونی — پهنا و عمق همهٔ پوسته.`},Isometric:{term:`ایزومتریک (Isometric)`,def:`نمای سه‌چهارم. هر سه محور. ارتفاع درست می‌ماند. عکس نیست.`},Oblique:{term:`مایل (Oblique)`,def:`روبرو اندازهٔ واقعی است. عمق با ۴۵ درجه پس می‌رود و کوتاه‌تر کشیده می‌شود (cabinet).`},Elevation:{term:`نما (Elevation)`,def:`یک رخ خانه، پهنا و ارتفاع واقعی. نگاه مستقیم به دیوار.`},Orthographic:{term:`متعامد (Orthographic)`,def:`بدون زاویه، بدون فشردن. نماهای روبرو/پهلو/پشت و نمای بالا (پلان).`},"Floor plan":{term:`پلان کف (Floor plan)`,def:`نگاه از بالا به اتاق‌ها.`},Room:{term:`اتاق (Room)`,def:`فضای بسته با نام — آشپزخانه، حمام، خواب.`},"Interior wall":{term:`دیوار داخلی (Interior wall)`,def:`دیواری که یک فضای بزرگ را به اتاق‌ها می‌بُرد.`},Dimension:{term:`اندازه (Dimension)`,def:`برچسب اندازه روی دیوار یا فضا.`},"Door swing":{term:`قوس در (Door swing)`,def:`خمیدگی که نشان می‌دهد در به کدام سو باز می‌شود.`},Opening:{term:`دهانه (Opening)`,def:`در یا پنجره‌ای که در دیوار بریده شده.`},Circulation:{term:`گردش (Circulation)`,def:`چگونه مردم در پلان راه می‌روند. (همان ترافیک.)`},Grid:{term:`شبکه (Grid)`,def:`خط‌های یکنواخت که کمک می‌کنند ب nger piles on itself — icons for undo, 2D/3D, and save, with More for the rest`,`Tools and Teach stay as side chips. Drawers slide up from the bottom on a phone`]},{version:`1.0.34`,date:`2026-09-09`,bullets:[`Best Dog House Contest: New → Dog House, then Contest — Baboo scores the den from the textbook list`,`She wants a snug closed box, a 12–18" door off-center, a pitched roof, and a shade tree — not a people bedroom`]},{version:`1.0.33`,date:`2026-09-09`,bullets:[`Sketch is the first tool: drag like a pencil on the plan — architecture starts here`,`Tap a sketch → Trace to turn it into straight walls. The pencil line stays as an underlay`]},{version:`1.0.32`,date:`2026-09-09`,bullets:[`Copyright: © 2026 Richard Kulibert Jr.`]},{version:`1.0.31`,date:`2026-09-09`,bullets:[`Toolbar icons redrawn so they stay clear when tiny — same black stroke, same periwinkle flash`,`Clip is a cut corner now, not scissors. Tree, bed, and path each have their own picture`]},{version:`1.0.30`,date:`2026-09-09`,bullets:[`New icon set for every draw tool, Teach, Access, Help, and Settings — same stroke, same periwinkle flash`]},{version:`1.0.29`,date:`2026-09-09`,bullets:[`Tap a door, window, wall, or furniture — a tiny menu sits under it to change size, swing, or delete`,`Drag a door or window to slide it along the wall. After you place one, the menu opens so you can finish it`]},{version:`1.0.28`,date:`2026-09-09`,bullets:[`Angled rooms: walls snap to 45° as well as 90° — hold Shift for square only`,`Wall → Clip a sharp corner; the room fill and area follow the chamfer`]},{version:`1.0.27`,date:`2026-09-08`,bullets:[`Teacher drawer: Version, What’s new, and Debug in one place — tap the version chip or long-press for Teacher`,`CHANGELOG.md matches the in-app notes so class share and studio stay in sync`]},{version:`1.0.26`,date:`2026-09-08`,bullets:[`GUI pass: same Stark white, black, and periwinkle — quieter chrome, softer cards, friendlier type`]},{version:`1.0.25`,date:`2026-09-08`,bullets:[`Phone: drag the plan to look around, pinch to zoom — tools tuck into a chip so the house can fill the screen`,`Fit stays on the top bar so you can always snap the house back into view`]},{version:`1.0.24`,date:`2026-09-08`,bullets:[`Access check: doors 32", halls 36", bath 5' turn, kitchen aisle, door swing — classroom ADA, not a legal stamp`,`Open Access from the right-hand chip or More. Click a row to highlight it on the plan`]},{version:`1.0.23`,date:`2026-09-08`,bullets:[`2D: Size tool (two clicks), plan notes, and Plant (tree / bed / path)`,`Straight walls by default, live length while you draw, Fit, plus a north arrow and scale bar`]},{version:`1.0.22`,date:`2026-09-07`,bullets:[`Class folder: More → Class folder downloads a zip you drop on the share — kids open index.html in Chrome`,`Works from a network drive or USB with no login and no server; each Chromebook still autosaves on that device`]},{version:`1.0.21`,date:`2026-09-07`,bullets:[`Crowd test: scatter 80 / 250 / 800 pieces and watch the FPS chip — canvas 2D still holds a busy house`,`Plan stays snappy: one grid draw, no redraw on every mouse wiggle, labels hide when the plan is packed`]},{version:`1.0.20`,date:`2026-09-07`,bullets:[`Baboo talks like a studio pal: warmer welcome, cheer-you-on coach, kinder toasts`,`Logo sits with the next-step card; empty-plan tips and Help greet you instead of barking orders`]},{version:`1.0.19`,date:`2026-09-07`,bullets:[`Skill levels: Novice, Beginner, Moderate, Expert — pick on New project or in Settings`,`Novice and Beginner get a next-step coach from what is missing on the plan`,`Higher levels unlock Window, Room, Furniture, then interior walls, duplicate, rotate, and layers`]},{version:`1.0.18`,date:`2026-09-07`,bullets:[`Floating Tools chip on the left and Teach chip on the right — grid uses the full workspace`,`Hover, click, or an active tool opens the palette; Min or Escape tucks it away`]},{version:`1.0.17`,date:`2026-09-07`,bullets:[`Room tool: name enclosed spaces from closed walls (Kitchen, Bath, Living…)`,`Interior walls split rooms; Teach lists named-room checklist`]},{version:`1.0.11`,date:`2026-09-06`,bullets:[`Fix: guiTheme fallbacks coerced to stark; dream remains Flo HOLD default`]},{version:`1.0.10`,date:`2026-09-06`,bullets:[`Tools-ease UDL: empty-plan Wall CTA, wall second-click hint, Door/Window “click on a wall” + miss toast ≥3s + near-wall cyan highlight`,`Furniture place → “Switched to Select — click to move”; Select/Pan tips; tool ≥44px + cyan focus + check/underline active`,`3D view-only: hide Wall/Door/Window/Furniture/Pan + Furniture sidebar; View only chip stays; Plan restores tools`,`Chrome labels: Save file · Class card · Settings; Teacher gated (long-press version / ?teacher=1); softer student toasts`,`Teaching soften UDL: Unit 1 / challenges / reflections / vocab one-step prompts (ids unchanged)`,`Optional GUI themes on tree (stark · ink · projector); Diego lock: Baboo default Stark; dream = TechWorks only`]},{version:`1.0.9`,date:`2026-09-06`,bullets:[`3D Solid view: site ground pad + soft blue sky (StyleBot dusk-soft) around house massing`,`Muted sage ground (#5F6F52); cyan horizon hairline; one soft sun shade cue - Chromebook SVG, no WebGL`,`Drag-to-pan in 3D preview; view-only chip + Plan edit path unchanged`]},{version:`1.0.8`,date:`2026-09-06`,bullets:[`P0 phone Teaching: defaults collapsed ≤640px; sheet ≤~40vh + backdrop dismiss; body scroll lock only while open; sticky chrome tappable`,`P0 toolbar: tools wrap 3-col (≥44px); secondary actions collapse into More menu — no mystery horizontal scroll`]},{version:`1.0.7`,date:`2026-09-06`,bullets:[`Export gallery card: format archworks-gallery-card (alias · title · styleName · roofLabel · shell · areaSqFt null · reflection · appVersion)`,`FERPA: alias only — no legal names; textureId id only; assets.planPng/view3dPng null (Chromebook lean)`,`UI: Export gallery card in GalleryCardPreview (Customize / Help) + chrome Gallery card`,`S
